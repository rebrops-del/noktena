name: Temporary card visual fix

on:
  push:
    paths:
      - '.github/workflows/temp-card-visual-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply card fixes
        run: |
          cat > assets/card-visual-fixes.css <<'CSS'
          /* NOKTENA — card display refinements */
          .hit-badge,
          .f-card-overlay-tags .hit{
            background:#e5323d!important;
            border-color:#e5323d!important;
            color:#fff!important;
          }

          /* Product cards show one clean static image. Full gallery remains on product detail pages. */
          .f-card .f-gallery-nav,
          .f-card .f-gallery-count{
            display:none!important;
          }
          CSS

          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<link rel="stylesheet" href="assets/font-refresh.css?v=20260918-2">'
          link='<link rel="stylesheet" href="assets/card-visual-fixes.css?v=20260918-1">'
          if link not in s:
              if marker not in s:
                  raise SystemExit('font-refresh marker not found')
              s=s.replace(marker, marker+'\n'+link, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name 'rebrops-del'
          git config user.email 'rebrops@gmail.com'
          git add assets/card-visual-fixes.css index.html
          git commit -m 'Make bestseller badges red and simplify card images'
          git pull --rebase origin main
          git push origin main
