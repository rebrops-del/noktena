name: Add mattress subtitle
on:
  push:
    paths:
      - '.github/workflows/add-mattress-subtitle.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add subtitle under mattress heading
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          # Remove an older subtitle if this workflow is ever re-run.
          text = re.sub(r'\s*<p class="mattress-catalog-subtitle">.*?</p>', '', text, flags=re.S)

          pattern = r'(<h2[^>]*>\s*Матрасы для комфортного сна\s*</h2>)'
          replacement = r'''\1\n<p class="mattress-catalog-subtitle">Подберите матрас для полноценного отдыха и комфортного сна. Сравните жёсткость, состав и подходящий размер.</p>'''
          text, n = re.subn(pattern, replacement, text, count=1, flags=re.I)
          if n != 1:
              raise SystemExit('Mattress heading not found')

          if '/* mattress-catalog-subtitle */' not in text:
              css = '''\n<style>/* mattress-catalog-subtitle */\n.mattress-catalog-subtitle{margin:8px 0 0;max-width:820px;color:#687b72;font-size:16px;line-height:1.55;font-weight:400}\n@media(max-width:700px){.mattress-catalog-subtitle{font-size:14px;line-height:1.5}}\n</style>\n'''
              text = text.replace('</head>', css + '</head>', 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit changes and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add descriptive subtitle to mattress catalog"
          git rm .github/workflows/add-mattress-subtitle.yml
          git commit -m "Remove temporary mattress subtitle workflow"
          git push
