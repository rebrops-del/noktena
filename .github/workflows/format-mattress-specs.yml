name: Format mattress composition and characteristics
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/format-mattress-specs.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Format mattress details
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          repo = Path('.')
          index_path = repo / 'index.html'
          detail_js_path = repo / 'assets/product-detail.js'
          card_css_path = repo / 'assets/card-visual-fixes.css'
          detail_css_path = repo / 'assets/product-detail.css'
          product_html_path = repo / 'product.html'

          index = index_path.read_text(encoding='utf-8')
          marker = "function normalizeSize(s){"
          if 'function mattressDetailsMarkup(x)' not in index:
              helper = r'''function cleanMattressText(value){return String(value||'').replace(/\s+/g,' ').replace(/\s+([,.;:])/g,'$1').replace(/\s+-\s+/g,' — ').trim().replace(/[.!?]+$/,'')}
function splitMattressItems(value){const out=[];let buf='',depth=0;for(const ch of String(value||'')){if(ch==='(')depth++;if(ch===')'&&depth>0)depth--;if(ch===','&&depth===0){if(buf.trim())out.push(buf.trim());buf='';continue}buf+=ch}if(buf.trim())out.push(buf.trim());return out}
function mattressDetailsData(x){const raw=String(x.description||x.intro||'').replace(/\s+/g,' ').trim(),composition=[],facts=[];const addFact=(k,v)=>{v=cleanMattressText(v);if(v&&!facts.some(([a,b])=>a===k&&b===v))facts.push([k,v])};const firm=getFirmness(x);if(firm&&firm!=='Уточняется'&&firm!=='Не применяется')addFact('Жёсткость',firm);if(x.category&&!/^хит(ы)? продаж$/i.test(String(x.category).trim()))addFact('Категория',x.category);const intro=cleanMattressText(x.intro||'').toLowerCase();const sentences=raw.split(/(?<=[.!?])\s+/).map(cleanMattressText).filter(Boolean);for(const sentence of sentences){const low=sentence.toLowerCase();if(intro&&low===intro)continue;if(/ж[её]стк|мягк/.test(low)&&/матрас/.test(low))continue;let m=sentence.match(/^Высота\s*:?[\s—-]*(.+)$/i);if(m){addFact('Высота',m[1]);continue}m=sentence.match(/^(Максимальная нагрузка|Допустимая нагрузка|Нагрузка на спальное место|Нагрузка)\s*:?[\s—-]*(.+)$/i);if(m){addFact(m[1],m[2]);continue}for(const part of splitMattressItems(sentence)){const item=cleanMattressText(part);if(item&&!composition.includes(item))composition.push(item)}}return{composition,facts}}
function mattressDetailsMarkup(x){const d=mattressDetailsData(x);const composition=d.composition.length?`<div class="mattress-spec-group"><strong>Состав</strong><ul class="mattress-spec-list">${d.composition.map(item=>`<li>${safe(item)}</li>`).join('')}</ul></div>`:'';const facts=d.facts.length?`<div class="mattress-spec-group"><strong>Характеристики</strong><div class="mattress-spec-facts">${d.facts.map(([k,v])=>`<div><span>${safe(k)}</span><b>${safe(v)}</b></div>`).join('')}</div></div>`:'';return `<div class="mattress-structured">${composition}${facts||(!composition?'<div class="mattress-spec-empty">Характеристики уточняйте при оформлении заказа.</div>':'')}</div>`}
'''
              if marker not in index:
                  raise SystemExit('index helper marker not found')
              index = index.replace(marker, helper + marker, 1)

          old_catalog = "<div class=\"speccontent\">${safe(x.description||x.intro||'Описание уточняется')}</div>"
          new_catalog = "<div class=\"speccontent\">${mattressDetailsMarkup(x)}</div>"
          if old_catalog in index:
              index = index.replace(old_catalog, new_catalog, 1)
          elif new_catalog not in index:
              raise SystemExit('catalog mattress description target not found')
          index = index.replace('assets/card-visual-fixes.css?v=20260918-2','assets/card-visual-fixes.css?v=20260918-mattressspec1')
          index_path.write_text(index, encoding='utf-8')

          js = detail_js_path.read_text(encoding='utf-8')
          detail_marker = "  function swatchCss(name){"
          if 'function mattressDetailMarkup(product,firmness)' not in js:
              detail_helper = r'''  function cleanMattressText(value){return String(value||'').replace(/\s+/g,' ').replace(/\s+([,.;:])/g,'$1').replace(/\s+-\s+/g,' — ').trim().replace(/[.!?]+$/,'')}
  function splitMattressItems(value){const out=[];let buf='',depth=0;for(const ch of String(value||'')){if(ch==='(')depth++;if(ch===')'&&depth>0)depth--;if(ch===','&&depth===0){if(buf.trim())out.push(buf.trim());buf='';continue}buf+=ch}if(buf.trim())out.push(buf.trim());return out}
  function mattressDetailData(product,firmness){const raw=String(product.description||product.intro||'').replace(/\s+/g,' ').trim(),composition=[],facts=[];const addFact=(k,v)=>{v=cleanMattressText(v);if(v&&!facts.some(([a,b])=>a===k&&b===v))facts.push([k,v])};if(firmness&&firmness!=='Уточняется'&&firmness!=='Не применяется')addFact('Жёсткость',firmness);if(product.category&&!/^хит(ы)? продаж$/i.test(String(product.category).trim()))addFact('Категория',product.category);const intro=cleanMattressText(product.intro||'').toLowerCase();for(const sentence of raw.split(/(?<=[.!?])\s+/).map(cleanMattressText).filter(Boolean)){const low=sentence.toLowerCase();if(intro&&low===intro)continue;if(/ж[её]стк|мягк/.test(low)&&/матрас/.test(low))continue;let m=sentence.match(/^Высота\s*:?[\s—-]*(.+)$/i);if(m){addFact('Высота',m[1]);continue}m=sentence.match(/^(Максимальная нагрузка|Допустимая нагрузка|Нагрузка на спальное место|Нагрузка)\s*:?[\s—-]*(.+)$/i);if(m){addFact(m[1],m[2]);continue}for(const part of splitMattressItems(sentence)){const item=cleanMattressText(part);if(item&&!composition.includes(item))composition.push(item)}}return{composition,facts}}
  function mattressDetailMarkup(product,firmness){const d=mattressDetailData(product,firmness);const composition=d.composition.length?`<div class="pd-mattress-block"><h3>Состав</h3><ul class="pd-mattress-list">${d.composition.map(item=>`<li>${esc(item)}</li>`).join('')}</ul></div>`:'';const facts=d.facts.length?`<div class="pd-mattress-block"><h3>Характеристики</h3><div class="pd-mattress-facts">${d.facts.map(([k,v])=>`<div><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join('')}</div></div>`:'';return `<div class="pd-mattress-details">${composition}${facts||(!composition?'<p class="pd-description">Характеристики уточняйте при оформлении заказа.</p>':'')}</div>`}
'''
              if detail_marker not in js:
                  raise SystemExit('detail helper marker not found')
              js = js.replace(detail_marker, detail_helper + detail_marker, 1)

          old_detail = '<section class="pd-section-card"><div class="pd-section-title"><span>01</span><h2>Состав и характеристики</h2></div><div class="pd-specs"><div class="pd-spec"><span>Жёсткость</span><b>${esc(firmness)}</b></div><div class="pd-spec"><span>Категория</span><b>${esc(product.category||\'Матрасы\')}</b></div></div><p class="pd-description pd-description-spaced">${esc(product.description||product.intro||\'Описание уточняется\')}</p></section>'
          new_detail = '<section class="pd-section-card"><div class="pd-section-title"><span>01</span><h2>Состав и характеристики</h2></div>${mattressDetailMarkup(product,firmness)}</section>'
          if old_detail in js:
              js = js.replace(old_detail, new_detail, 1)
          elif new_detail not in js:
              raise SystemExit('detail mattress section target not found')
          detail_js_path.write_text(js, encoding='utf-8')

          card_css = card_css_path.read_text(encoding='utf-8')
          if '/* Structured mattress composition */' not in card_css:
              card_css += r'''

/* Structured mattress composition */
.card .speccontent{white-space:normal!important;padding:14px!important}
.mattress-structured{display:grid;gap:16px}
.mattress-spec-group{display:grid;gap:9px}
.mattress-spec-group>strong{display:block;color:#264a3d;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.mattress-spec-list{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.mattress-spec-list li{position:relative;padding-left:15px;color:#5f7169;font-size:10.5px;line-height:1.5}
.mattress-spec-list li:before{content:"";position:absolute;left:0;top:.62em;width:5px;height:5px;border-radius:50%;background:#b49661}
.mattress-spec-facts{border-top:1px solid #ece7dd}
.mattress-spec-facts>div{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:12px;padding:8px 0;border-bottom:1px solid #f0ece4;align-items:start}
.mattress-spec-facts span{color:#87938d;font-size:10px;line-height:1.35}
.mattress-spec-facts b{color:#2d4b40;font-size:10px;line-height:1.35;font-weight:600;text-align:right}
.mattress-spec-empty{color:#74827b;font-size:10.5px;line-height:1.5}
@media(max-width:620px){.mattress-spec-facts>div{grid-template-columns:1fr;gap:3px}.mattress-spec-facts b{text-align:left}}
'''
              card_css_path.write_text(card_css, encoding='utf-8')

          detail_css = detail_css_path.read_text(encoding='utf-8')
          if '/* Structured mattress detail */' not in detail_css:
              detail_css += r'''

/* Structured mattress detail */
.pd-mattress-details{display:grid;gap:24px}
.pd-mattress-block{display:grid;gap:12px}
.pd-mattress-block h3{margin:0;color:#294a3f;font-family:Onest,"Segoe UI",sans-serif;font-size:12px;line-height:1.2;font-weight:700;letter-spacing:.07em;text-transform:uppercase}
.pd-mattress-list{list-style:none;margin:0;padding:0;display:grid;gap:0;border-top:1px solid #eee9df}
.pd-mattress-list li{position:relative;padding:11px 8px 11px 20px;border-bottom:1px solid #eee9df;color:#586b63;font-size:12.5px;line-height:1.5}
.pd-mattress-list li:before{content:"";position:absolute;left:2px;top:17px;width:6px;height:6px;border-radius:50%;background:#b8975e}
.pd-mattress-facts{display:grid;grid-template-columns:1fr 1fr;gap:0 24px;border-top:1px solid #eee9df}
.pd-mattress-facts>div{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;padding:12px 0;border-bottom:1px solid #eee9df;font-size:11.5px}
.pd-mattress-facts span{color:#819089}
.pd-mattress-facts b{text-align:right;color:#314d42;font-weight:700}
@media(max-width:620px){.pd-mattress-facts{grid-template-columns:1fr}.pd-mattress-facts>div{grid-template-columns:1fr;gap:4px}.pd-mattress-facts b{text-align:left}.pd-mattress-list li{font-size:12px}}
'''
              detail_css_path.write_text(detail_css, encoding='utf-8')

          product_html = product_html_path.read_text(encoding='utf-8')
          product_html = product_html.replace('assets/product-detail.css?v=20260918-textcolors1','assets/product-detail.css?v=20260918-mattressspec1')
          product_html = product_html.replace('assets/product-detail.js?v=20260918-dynamicspec2','assets/product-detail.js?v=20260918-mattressspec1')
          product_html_path.write_text(product_html, encoding='utf-8')
          PY

          node --check assets/product-detail.js
          python - <<'PY'
          import re
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',html,re.S)
          Path('/tmp/noktena-index-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/noktena-index-inline.js
          grep -q 'mattressDetailsMarkup(x)' index.html
          grep -q 'mattressDetailMarkup(product,firmness)' assets/product-detail.js
      - name: Commit changes and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html product.html assets/product-detail.js assets/product-detail.css assets/card-visual-fixes.css
          git rm .github/workflows/format-mattress-specs.yml
          git commit -m 'Structure mattress composition and characteristics'
          git push origin main
# trigger
