name: Use protected admin upload function

on:
  push:
    paths:
      - 'scripts/use_admin_upload_function.py'
      - '.github/workflows/use-admin-upload-function.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python scripts/use_admin_upload_function.py
      - name: Validate JavaScript syntax
        run: node --check admin/admin.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin/admin.js admin/index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Route admin image uploads through protected function"
            git push
          fi
