name: Patch MAX order notifications

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/patch-max-order-notifications.yml'
      - 'scripts/patch-max-order-notifications.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch server
        run: python scripts/patch-max-order-notifications.py
      - name: Validate server
        run: |
          node --check railway-admin/server.js
          grep -q 'platform-api2.max.ru' railway-admin/server.js
          grep -q 'MAX_BOT_TOKEN' railway-admin/server.js
          grep -q 'notifyOrderByMax' railway-admin/server.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add railway-admin/server.js
          git diff --cached --quiet && exit 0
          git commit -m 'Send new order notifications to MAX'
          git push
