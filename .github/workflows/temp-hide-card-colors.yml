name: Hide color selector from catalog cards

on:
  push:
    paths:
      - '.github/workflows/temp-hide-card-colors.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove color selector from catalog cards
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('assets/catalog-v2.js')
          s=p.read_text(encoding='utf-8')

          old="""const colors=uniq(product.colors?.length?product.colors:(product.variants||[]).map(v=>v.color));const sizes=sortSizes(product.sizes?.length?product.sizes:(product.variants||[]).map(v=>v.size));const initial=preferredVariant(product,colors[0]||'',sizes[0]||'');const price=furniturePrice(product,initial,sizes[0]||'');const first=colorImageFor(product,colors[0]||'')||imgs[0]||'assets/hero-noktena-final.png?v=20260908-final2';"""
          new="""const sizes=sortSizes(product.sizes?.length?product.sizes:(product.variants||[]).map(v=>v.size));const initial=preferredVariant(product,'',sizes[0]||'');const price=furniturePrice(product,initial,sizes[0]||'');const first=imgs[0]||'assets/hero-noktena-final.png?v=20260908-final2';"""
          if old not in s:
              raise SystemExit('card initialization block not found')
          s=s.replace(old,new,1)

          old='''data-product-link="${esc(link)}" data-selected-color="${esc(colors[0]||'')}" data-selected-size="${esc(sizes[0]||'')}"'''
          new='''data-product-link="${esc(link)}" data-selected-size="${esc(sizes[0]||'')}"'''
          if old not in s:
              raise SystemExit('selected color data attribute not found')
          s=s.replace(old,new,1)

          color_block='''        ${colors.length?`<div class="f-option"><div class="f-option-head"><span>Цвет</span><b class="f-color-name">${esc(colors[0])}</b></div><div class="f-color-list">${colors.slice(0,8).map((c,i)=>`<button type="button" class="f-color ${i===0?'is-active':''}" data-card-color="${esc(c)}" title="${esc(c)}" aria-label="Цвет ${esc(c)}">${esc(c)}</button>`).join('')}${colors.length>8?`<span class="f-more-options">+${colors.length-8}</span>`:''}</div></div>`:''}\n'''
          if color_block not in s:
              raise SystemExit('catalog color selector markup not found')
          s=s.replace(color_block,'',1)

          old="""function updateCardVariant(card){const product=productById(card?.dataset.productId);if(!product)return;const color=card.dataset.selectedColor||'';const size=card.dataset.selectedSize||'';const variant=preferredVariant(product,color,size);const price=furniturePrice(product,variant,size);const el=$('[data-card-price]',card),old=$('[data-card-old-price]',card);if(el)el.textContent=rub(price);if(old)old.textContent=rub(oldPrice(price));updateCardImage(card,product,color);}"""
          new="""function updateCardVariant(card){const product=productById(card?.dataset.productId);if(!product)return;const size=card.dataset.selectedSize||'';const variant=preferredVariant(product,'',size);const price=furniturePrice(product,variant,size);const el=$('[data-card-price]',card),old=$('[data-card-old-price]',card);if(el)el.textContent=rub(price);if(old)old.textContent=rub(oldPrice(price));}"""
          if old not in s:
              raise SystemExit('updateCardVariant block not found')
          s=s.replace(old,new,1)

          color_handler="""      const colorBtn=e.target.closest('[data-card-color]');if(colorBtn){e.preventDefault();e.stopPropagation();const card=colorBtn.closest('.f-card');if(!card)return;card.dataset.selectedColor=colorBtn.dataset.cardColor||'';$$('[data-card-color]',card).forEach(b=>b.classList.toggle('is-active',b===colorBtn));const name=$('.f-color-name',card);if(name)name.textContent=colorBtn.dataset.cardColor;updateCardVariant(card);return;}\n"""
          if color_handler not in s:
              raise SystemExit('catalog color click handler not found')
          s=s.replace(color_handler,'',1)

          s=s.replace("if(desc)desc.textContent=view==='beds'?'Выберите модель, цвет и спальное место. В полной карточке — фотографии, характеристики и доступные варианты.':'Прямые и угловые модели с выбором цвета и доступных вариантов. Для каждого цвета показываем соответствующую фотографию, когда она предоставлена в каталоге.';",
                      "if(desc)desc.textContent=view==='beds'?'Выберите модель и спальное место. Цвет, фотографии и все характеристики доступны внутри карточки товара.':'Прямые и угловые модели. Цвет, фотографии и доступные варианты выбираются внутри карточки товара.';")

          if 'data-card-color' in s:
              raise SystemExit('data-card-color remains in catalog-v2.js')
          p.write_text(s,encoding='utf-8')

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'assets/catalog-v2\.js\?v=[^"\']+', 'assets/catalog-v2.js?v=20260918-nocardcolors1', s)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate JavaScript
        run: |
          node --check assets/catalog-v2.js
          grep -q '20260918-nocardcolors1' index.html
          ! grep -q 'data-card-color' assets/catalog-v2.js
      - name: Commit changes
        run: |
          git config user.name 'rebrops-del'
          git config user.email 'rebrops@gmail.com'
          git rm -f .github/workflows/temp-hide-card-colors.yml
          git add assets/catalog-v2.js index.html
          git commit -m 'Hide furniture colors from catalog cards'
          git pull --rebase origin main
          git push origin main
