name: Add city switcher
on:
  push:
    paths:
      - '.github/workflows/add-city-switcher.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add city selector to headers
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          style = r'''
          <style id="city-switcher-v1">
          .site-top-meta{display:flex;align-items:center;justify-content:flex-end;gap:8px;min-width:0;font-size:13px;font-weight:700;white-space:nowrap}
          .site-top-meta a{color:inherit;text-decoration:none;font-weight:800}
          .site-top-meta a:hover{text-decoration:underline}
          .site-top-divider{opacity:.55}
          .city-picker{position:relative;z-index:60}
          .city-picker summary{list-style:none;display:inline-flex;align-items:center;gap:6px;cursor:pointer;color:#fff;font:inherit;font-weight:800;outline:none}
          .city-picker summary::-webkit-details-marker{display:none}
          .city-pin{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border:1px solid rgba(255,255,255,.38);border-radius:50%;font-size:11px;line-height:1}
          .city-chevron{font-size:11px;opacity:.72;transition:transform .18s ease}
          .city-picker[open] .city-chevron{transform:rotate(180deg)}
          .city-popover{position:absolute;right:0;top:calc(100% + 11px);width:260px;padding:14px;background:#fff;color:#173e32;border:1px solid rgba(23,62,50,.12);border-radius:16px;box-shadow:0 16px 40px rgba(11,44,34,.18)}
          .city-popover:before{content:"";position:absolute;right:22px;top:-6px;width:12px;height:12px;background:#fff;border-left:1px solid rgba(23,62,50,.12);border-top:1px solid rgba(23,62,50,.12);transform:rotate(45deg)}
          .city-popover-title{display:block;margin:0 0 9px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#8a7350;font-weight:800}
          .city-option{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 12px;border:1px solid #dce7e1;border-radius:12px;background:#f7faf8;color:#173e32;font:inherit;font-size:13px;font-weight:800;text-align:left}
          .city-option b{color:#9a7a43}
          .city-popover small{display:block;margin-top:9px;color:#7a8982;font-size:10.5px;line-height:1.45;font-weight:500;white-space:normal}
          @media(max-width:900px){.site-top-meta{gap:6px;font-size:11px}.site-top-warehouse{display:none}}
          @media(max-width:680px){.site-top-meta .site-top-divider,.site-top-meta .site-top-email{display:none}.city-picker summary{font-size:11px}.city-popover{right:-6px;width:240px}}
          </style>
          '''

          def add_style(text):
              if 'id="city-switcher-v1"' not in text:
                  text = text.replace('</head>', style + '\n</head>', 1)
              return text

          city = '''<details class="city-picker"><summary aria-label="Выбрать город"><span class="city-pin">⌖</span><span>г. Екатеринбург</span><span class="city-chevron">⌄</span></summary><div class="city-popover"><span class="city-popover-title">Ваш город</span><div class="city-option" aria-current="true"><span>г. Екатеринбург</span><b>✓</b></div><small>В дальнейшем здесь можно будет переключаться между городами сети.</small></div></details>'''

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          text = add_style(text)
          new_top = f'''<div class="top"><div class="wrap"><span><b>НОКТЕНА</b> · федеральная онлайн-сеть товаров для сна</span><div class="site-top-meta">{city}<span class="site-top-divider">·</span><span class="site-top-warehouse">склад: г. Берёзовский</span><span class="site-top-divider">·</span><a class="site-top-email" href="mailto:noktena@mail.ru">noktena@mail.ru</a><span class="site-top-divider">·</span><a href="tel:+79321207635">+7 (932) 120-76-35</a></div></div></div>'''
          text2, n = re.subn(r'<div class="top"><div class="wrap">.*?</div></div>\s*(?=<header)', new_top + '\n', text, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Could not replace homepage top bar')
          index.write_text(text2, encoding='utf-8')

          product = Path('product.html')
          text = product.read_text(encoding='utf-8')
          text = add_style(text)
          new_pd_top = f'''<div class="pd-top"><div class="pd-wrap"><span><b>НОКТЕНА</b> · федеральная онлайн-сеть товаров для сна</span><div class="site-top-meta">{city}<span class="site-top-divider">·</span><span class="site-top-warehouse">склад: г. Берёзовский</span><span class="site-top-divider">·</span><a class="site-top-email" href="mailto:noktena@mail.ru">noktena@mail.ru</a><span class="site-top-divider">·</span><a href="tel:+79321207635">+7 (932) 120-76-35</a></div></div></div>'''
          text2, n = re.subn(r'<div class="pd-top"><div class="pd-wrap">.*?</div></div>\s*(?=<header class="pd-nav">)', new_pd_top + '\n', text, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Could not replace product top bar')
          product.write_text(text2, encoding='utf-8')
          PY
      - name: Commit changes and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html product.html
          git commit -m "Add expandable city selector to headers"
          git rm .github/workflows/add-city-switcher.yml
          git commit -m "Remove temporary city switcher workflow"
          git push
