name: Apply catalog image storage

on:
  push:
    paths:
      - 'scripts/store_admin_images_in_catalog_images.py'
      - '.github/workflows/apply-catalog-image-storage.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch catalog image storage
        run: python scripts/store_admin_images_in_catalog_images.py
      - name: Validate JavaScript
        run: |
          node --check admin/admin.js
          node --check assets/catalog-runtime.js
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin/admin.js admin/index.html assets/catalog-runtime.js index.html product.html
          git diff --cached --quiet && exit 0
          git commit -m 'Store admin images separately from product payloads'
          git push
