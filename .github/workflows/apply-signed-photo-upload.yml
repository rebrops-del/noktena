name: Apply signed photo upload

on:
  push:
    paths:
      - '.github/workflows/apply-signed-photo-upload.yml'
      - 'scripts/apply_signed_photo_upload.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch admin photo uploader
        run: python scripts/apply_signed_photo_upload.py
      - name: Validate JavaScript
        run: node --check admin/admin.js
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin/admin.js admin/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Upload admin photos with signed storage URLs'
          git push
