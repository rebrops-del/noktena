name: Fix Bestseller Filter
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-hit-filter.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch hit filter logic
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="function draw(){const term=q.value.trim().toLowerCase(),cat=c.value,selected=sz.value,max=mx.disabled||!mx.value?Infinity:+mx.value;const rows=products.filter(x=>{if(cat&&x.category!==cat)return false;"
          new="function isHitProduct(x){const badge=String(x?.badge||'').trim().toLowerCase();if(badge==='none')return false;if(badge==='hit')return true;return x?.hit===true||BESTSELLERS.has(x.model)||/^хит(ы)? продаж$/i.test(String(x.category||'').trim())}function draw(){const term=q.value.trim().toLowerCase(),cat=c.value,selected=sz.value,max=mx.disabled||!mx.value?Infinity:+mx.value;const rows=products.filter(x=>{if(cat){if(/^хит(ы)? продаж$/i.test(String(cat).trim())){if(!isHitProduct(x))return false}else if(x.category!==cat)return false;}"
          if old not in s:
              raise SystemExit('draw filter marker not found')
          s=s.replace(old,new,1)
          old2="const firm=getFirmness(x),hit=BESTSELLERS.has(x.model)||/^хит(ы)? продаж$/i.test(String(x.category||'').trim()),firmBlock="
          new2="const firm=getFirmness(x),hit=isHitProduct(x),firmBlock="
          if old2 not in s:
              raise SystemExit('hit render marker not found')
          s=s.replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        run: |
          grep -q "function isHitProduct" index.html
          grep -q "if(!isHitProduct(x))return false" index.html
          grep -q "hit=isHitProduct(x)" index.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Show all bestseller-badged mattresses in bestseller filter'
          git push
