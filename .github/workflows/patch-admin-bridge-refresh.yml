name: Patch admin bridge refresh
on:
  push:
    paths:
      - '.github/workflows/patch-admin-bridge-refresh.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch bridge auth and cache bust
        shell: python
        run: |
          from pathlib import Path
          p = Path('admin/admin.js')
          s = p.read_text(encoding='utf-8')
          old = "const all = {...fields, request_id: requestId, access_token: state.session.access_token};"
          new = "const all = {...fields, request_id: requestId, access_token: state.session.access_token, refresh_token: state.session.refresh_token || ''};"
          if old not in s:
              raise SystemExit('bridge auth marker not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          ip = Path('admin/index.html')
          html = ip.read_text(encoding='utf-8').replace('admin.js?v=20260919-corebridge1','admin.js?v=20260919-corebridge2')
          ip.write_text(html, encoding='utf-8')
      - name: Validate JavaScript
        run: node --check admin/admin.js
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin/admin.js admin/index.html
          git commit -m 'Send refresh token through admin photo bridge' || exit 0
          git push
