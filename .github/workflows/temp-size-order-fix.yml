name: Temporary size order fix

on:
  push:
    paths:
      - '.github/workflows/temp-size-order-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sort product sizes from 800 upward
        run: |
          python - <<'PY'
          from pathlib import Path

          # Furniture cards in catalog
          p=Path('assets/catalog-v2.js')
          s=p.read_text(encoding='utf-8')
          marker="  function uniq(list){return [...new Set((list||[]).filter(Boolean).map(v=>String(v).trim()).filter(Boolean))];}\n"
          helper="""  function uniq(list){return [...new Set((list||[]).filter(Boolean).map(v=>String(v).trim()).filter(Boolean))];}\n  function sizeSortValue(value){\n    const nums=String(value||'').replace(/×/g,'х').match(/\\d+/g)?.map(Number)||[];\n    return [nums[0]??Number.MAX_SAFE_INTEGER,nums[1]??Number.MAX_SAFE_INTEGER,String(value||'')];\n  }\n  function sortSizes(list){return uniq(list).sort((a,b)=>{const A=sizeSortValue(a),B=sizeSortValue(b);return A[0]-B[0]||A[1]-B[1]||A[2].localeCompare(B[2],'ru');});}\n"""
          if marker not in s:
              raise SystemExit('catalog uniq marker not found')
          s=s.replace(marker,helper,1)
          old="const colors=uniq(product.colors?.length?product.colors:(product.variants||[]).map(v=>v.color));const sizes=uniq(product.sizes?.length?product.sizes:(product.variants||[]).map(v=>v.size));"
          new="const colors=uniq(product.colors?.length?product.colors:(product.variants||[]).map(v=>v.color));const sizes=sortSizes(product.sizes?.length?product.sizes:(product.variants||[]).map(v=>v.size));"
          if old not in s:
              raise SystemExit('catalog sizes marker not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # Product detail page: furniture + mattresses
          p=Path('assets/product-detail.js')
          s=p.read_text(encoding='utf-8')
          marker="  const uniq=list=>[...new Set((list||[]).filter(Boolean).map(v=>String(v).trim()).filter(Boolean))];\n"
          helper="""  const uniq=list=>[...new Set((list||[]).filter(Boolean).map(v=>String(v).trim()).filter(Boolean))];\n  const sizeSortValue=value=>{const nums=String(value||'').replace(/×/g,'х').match(/\\d+/g)?.map(Number)||[];return [nums[0]??Number.MAX_SAFE_INTEGER,nums[1]??Number.MAX_SAFE_INTEGER,String(value||'')];};\n  const sortSizes=list=>uniq(list).sort((a,b)=>{const A=sizeSortValue(a),B=sizeSortValue(b);return A[0]-B[0]||A[1]-B[1]||A[2].localeCompare(B[2],'ru');});\n  const sortVariantsBySize=list=>[...(list||[])].sort((a,b)=>{const A=sizeSortValue(a?.size),B=sizeSortValue(b?.size);return A[0]-B[0]||A[1]-B[1]||A[2].localeCompare(B[2],'ru');});\n"""
          if marker not in s:
              raise SystemExit('detail uniq marker not found')
          s=s.replace(marker,helper,1)
          old="const colors=uniq(product.colors?.length?product.colors:(product.variants||[]).map(v=>v.color));const sizes=uniq(product.sizes?.length?product.sizes:(product.variants||[]).map(v=>v.size));"
          new="const colors=uniq(product.colors?.length?product.colors:(product.variants||[]).map(v=>v.color));const sizes=sortSizes(product.sizes?.length?product.sizes:(product.variants||[]).map(v=>v.size));"
          if old not in s:
              raise SystemExit('detail furniture sizes marker not found')
          s=s.replace(old,new,1)
          old="const variants=(product.variants||[]).filter(v=>String(v.size)!=='600х1200');"
          new="const variants=sortVariantsBySize((product.variants||[]).filter(v=>String(v.size)!=='600х1200'));"
          if old not in s:
              raise SystemExit('detail mattress variants marker not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # Mattress catalog cards: keep their size selector ordered too
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="products=sets.flat().filter(x=>!REMOVE_MODELS.has(x.model)).map(x=>({...x,variants:x.variants.filter(v=>normalizeSize(v.size)!=='600х1200')})).filter(x=>x.variants.length);"
          new="products=sets.flat().filter(x=>!REMOVE_MODELS.has(x.model)).map(x=>({...x,variants:x.variants.filter(v=>normalizeSize(v.size)!=='600х1200').sort((a,b)=>{const A=normalizeSize(a.size).match(/\\d+/g)?.map(Number)||[],B=normalizeSize(b.size).match(/\\d+/g)?.map(Number)||[];return (A[0]??99999)-(B[0]??99999)||(A[1]??99999)-(B[1]??99999);})})).filter(x=>x.variants.length);"
          if old not in s:
              raise SystemExit('index mattress variants marker not found')
          s=s.replace(old,new,1)
          s=s.replace('assets/catalog-v2.js?v=20260918-premium3','assets/catalog-v2.js?v=20260918-size1')
          p.write_text(s,encoding='utf-8')

          # Bust product detail JS cache
          p=Path('product.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('assets/product-detail.js?v=20260918-premium3','assets/product-detail.js?v=20260918-size1')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate JavaScript
        run: |
          node --check assets/catalog-v2.js
          node --check assets/product-detail.js
      - name: Commit changes
        run: |
          git config user.name 'rebrops-del'
          git config user.email 'rebrops@gmail.com'
          git add assets/catalog-v2.js assets/product-detail.js index.html product.html
          git commit -m 'Order product sizes from smallest width'
          git pull --rebase origin main
          git push origin main
