name: Temporary product detail integration

on:
  push:
    paths:
      - '.github/workflows/temp-product-detail-integration.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Connect catalog cards to product pages
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          s=s.replace(
              '<link rel="stylesheet" href="assets/catalog-v2.css?v=20260918-1">',
              '<link rel="stylesheet" href="assets/catalog-v2.css?v=20260918-2">\n<link rel="stylesheet" href="assets/catalog-card-enhancements.css?v=20260918-1">',
              1
          )

          old='return `<article class="card">${photo}<div class="body">'
          new='return `<article class="card product-open-card" data-product-link="product.html?kind=mattress&model=${encodeURIComponent(x.model)}">${photo}<div class="body">'
          if old not in s:
              raise SystemExit('Mattress card marker not found')
          s=s.replace(old,new,1)

          old_btn='<a class="btn max-btn" href="${MAX_LINK}" target="_blank" rel="noopener"><img class="max-icon" src="${MAX_ICON}" alt="" aria-hidden="true"><span>Написать в MAX</span></a></div></div></article>`'
          new_btn='<a class="product-more-link" href="product.html?kind=mattress&model=${encodeURIComponent(x.model)}">Подробнее о товаре <span aria-hidden="true">→</span></a><a class="btn max-btn" href="${MAX_LINK}" target="_blank" rel="noopener"><img class="max-icon" src="${MAX_ICON}" alt="" aria-hidden="true"><span>Написать в MAX</span></a></div></div></article>`'
          if old_btn not in s:
              raise SystemExit('Mattress button marker not found')
          s=s.replace(old_btn,new_btn,1)

          s=s.replace(
              '<script src="assets/catalog-v2.js?v=20260918-1"></script>',
              '<script src="assets/catalog-v2.js?v=20260918-2"></script>\n<script src="assets/catalog-card-open.js?v=20260918-1"></script>',
              1
          )

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit integration
        run: |
          git config user.name 'rebrops-del'
          git config user.email 'rebrops@gmail.com'
          git add index.html
          git commit -m 'Open every catalog card on a product detail page'
          git pull --rebase origin main
          git push origin main
