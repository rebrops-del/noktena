name: Fix product size summary

on:
  push:
    paths:
      - '.github/workflows/fix-product-summary.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Sync selected bed size in product summary
        run: |
          python - <<'PY'
          from pathlib import Path

          js = Path('assets/product-detail.js')
          text = js.read_text(encoding='utf-8')
          old = """  function updateFurnitureSelection(){\n    if(!furnitureProduct)return;updateFurnitureImage();const variant=variantFor(furnitureProduct,selectedColor,selectedSize);const price=furniturePrice(furnitureProduct,variant,selectedSize);const p=$('#pdFurniturePrice'),op=$('#pdFurnitureOldPrice');if(p)p.textContent=rub(price);if(op)op.textContent=rub(oldPrice(price));const extra=$('#pdVariantSpecs');if(extra){const attrs=variant?.attributes||{};const entries=Object.entries(attrs).filter(([k,v])=>k&&v&&!['Цвет фасада','Спальное место','Размер'].includes(k)&&!/производител|артикул|sku/i.test(k));extra.innerHTML=entries.length?`<div class=\"pd-variant-note\"><b>Выбранный вариант</b><div>${selectedColor?`<span>Цвет: ${esc(selectedColor)}</span>`:''}${selectedSize?`<span>Размер: ${esc(selectedSize)}</span>`:''}${entries.slice(0,4).map(([k,v])=>`<span>${esc(k)}: ${esc(v)}</span>`).join('')}</div></div>`:'';}\n  }"""
          new = """  function updateFurnitureSelection(){\n    if(!furnitureProduct)return;updateFurnitureImage();const variant=variantFor(furnitureProduct,selectedColor,selectedSize);const price=furniturePrice(furnitureProduct,variant,selectedSize);const p=$('#pdFurniturePrice'),op=$('#pdFurnitureOldPrice');if(p)p.textContent=rub(price);if(op)op.textContent=rub(oldPrice(price));\n    const subtitle=$('.pd-subtitle');\n    if(subtitle&&furnitureProduct.category==='beds'&&selectedSize){\n      const base=String(furnitureProduct.summary||String(furnitureProduct.description||'').split(/(?<=[.!?])\\s+/)[0]||'').trim();\n      const synced=base.match(/Спальное место\\s*[—-]/i)?base.replace(/Спальное место\\s*[—-]\\s*[^.]+\\.?\\s*/i,`Спальное место — ${selectedSize}. `):`Спальное место — ${selectedSize}. ${base}`;\n      subtitle.textContent=synced.trim();\n    }\n    const extra=$('#pdVariantSpecs');if(extra){const attrs=variant?.attributes||{};const entries=Object.entries(attrs).filter(([k,v])=>k&&v&&!['Цвет фасада','Спальное место','Размер'].includes(k)&&!/производител|артикул|sku/i.test(k));extra.innerHTML=entries.length?`<div class=\"pd-variant-note\"><b>Выбранный вариант</b><div>${selectedColor?`<span>Цвет: ${esc(selectedColor)}</span>`:''}${selectedSize?`<span>Размер: ${esc(selectedSize)}</span>`:''}${entries.slice(0,4).map(([k,v])=>`<span>${esc(k)}: ${esc(v)}</span>`).join('')}</div></div>`:'';}\n  }"""
          if old not in text:
              raise SystemExit('updateFurnitureSelection block not found')
          js.write_text(text.replace(old, new), encoding='utf-8')

          html = Path('product.html')
          h = html.read_text(encoding='utf-8')
          old_src = 'assets/product-detail.js?v=20260918-loaderfix1'
          if old_src not in h:
              old_src = 'assets/product-detail.js?v=20260918-textcolors1'
          if old_src not in h:
              raise SystemExit('product-detail cache-bust source not found')
          h = h.replace(old_src, 'assets/product-detail.js?v=20260918-size-sync1')
          html.write_text(h, encoding='utf-8')
          PY
      - name: Validate JavaScript
        run: node --check assets/product-detail.js
      - name: Commit fix and remove temporary workflow
        run: |
          rm .github/workflows/fix-product-summary.yml
          git config user.name 'rebrops-del'
          git config user.email 'rebrops@gmail.com'
          git add assets/product-detail.js product.html .github/workflows/fix-product-summary.yml
          git commit -m 'Keep bed sleeping size in sync on product page'
          git pull --rebase origin main
          git push origin main
