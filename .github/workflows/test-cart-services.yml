name: Test cart services
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'checkout.html'
      - 'index.html'
      - 'product.html'
      - 'assets/cart.js'
      - 'assets/city-catalog-core.js'
      - 'assets/city-catalog.js'
      - 'admin/index.html'
      - 'admin/city-catalog.js'
      - 'admin/city-catalog.css'
      - 'tests/city-catalog.test.cjs'
      - 'assets/checkout.js'
      - 'assets/cart.css'
      - 'railway-admin/**'
      - '.github/workflows/test-cart-services.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate cart and order code without writing production data
        run: |
          set -euxo pipefail
          node --check assets/checkout.js
          node --check assets/city-catalog-core.js
          node --check assets/city-catalog.js
          node --check admin/city-catalog.js
          node --check railway-admin/server.js
          node --test tests/analytics.test.cjs tests/city-catalog.test.cjs
          grep -q 'Подъём настраивается отдельно для каждого товара' checkout.html
          grep -q 'assemblyQty' assets/checkout.js
          grep -q 'data-lift-qty' assets/checkout.js
      - name: Check live pages and API health without creating an order
        run: |
          set -euxo pipefail
          for i in $(seq 1 40); do
            html=$(curl -fsSL "https://noktena.ru/checkout.html?smoke=$GITHUB_RUN_ID" || true)
            health=$(curl -fsSL "https://admin-proxy-v2-production.up.railway.app/health?smoke=$GITHUB_RUN_ID" || true)
            if printf '%s' "$html" | grep -q 'Подъём настраивается отдельно для каждого товара' && printf '%s' "$health" | grep -q '"ok":true'; then exit 0; fi
            sleep 5
          done
          exit 1
