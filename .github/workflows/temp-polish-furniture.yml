name: Temporary furniture catalog polish

on:
  push:
    paths:
      - '.github/workflows/temp-polish-furniture.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Polish homepage recommendations and source flags
        run: |
          python - <<'PY'
          from pathlib import Path

          # Do not infer a bestseller flag from generic page text.
          p=Path('scripts/import_berhouse_furniture.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace('"hit": "хит продаж" in full_text.lower(),','"hit": False,')
          p.write_text(s,encoding='utf-8')

          # Furniture UI: no unverified bestseller badges; balanced home selection.
          p=Path('assets/catalog-v2.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("    const hit=product.hit?'<span class=\"f-card-tag hit\">Хит продаж</span>':'';","    const hit='';")
          s=s.replace("    const hits=[...all.filter(p=>p.hit),...all.filter(p=>!p.hit)].slice(0,6);","    const hits=[...state.data.beds.slice(0,3),...state.data.sofas.slice(0,3)];")
          p.write_text(s,encoding='utf-8')

          # Homepage section should not make an unsupported sales-ranking claim.
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<h2>Хиты продаж</h2><p>Популярные модели из каталога НОКТЕНА. Перейдите в нужный раздел, чтобы посмотреть весь ассортимент.</p>','<h2>Рекомендуем посмотреть</h2><p>Подборка моделей из разделов «Кровати» и «Диваны». Перейдите в нужный раздел, чтобы посмотреть весь ассортимент.</p>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'rebrops-del'
          git config user.email 'rebrops@gmail.com'
          git add scripts/import_berhouse_furniture.py assets/catalog-v2.js index.html
          git commit -m 'Polish furniture recommendations and bestseller labels'
          git pull --rebase origin main
          git push origin main
