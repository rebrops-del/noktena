name: Verify separate delivery settings live
on:
  push:
    paths:
      - '.github/workflows/verify-separate-delivery.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify backend and public bootstrap
        run: |
          set -euxo pipefail
          API='https://admin-proxy-v2-production.up.railway.app/api/noktena-admin'
          BOOT='https://admin-proxy-v2-production.up.railway.app/catalog-bootstrap.js'
          curl -fsS "$API?action=health" -o /tmp/health.json
          node -e "const x=require('/tmp/health.json'); if(x.ok!==true || Number(x.version)<4) process.exit(1)"
          curl -fsS "$BOOT?check=$GITHUB_RUN_ID" -o /tmp/bootstrap.js
          grep -q 'deliverySettings' /tmp/bootstrap.js
          grep -q 'delivery_price' /tmp/bootstrap.js
          grep -q 'lift_price' /tmp/bootstrap.js
          grep -q 'sofa_lift_surcharge' /tmp/bootstrap.js
          grep -q '1500' /tmp/bootstrap.js
          grep -q '600' /tmp/bootstrap.js
          grep -q '400' /tmp/bootstrap.js

      - name: Wait for final Pages files
        run: |
          set -euxo pipefail
          for i in $(seq 1 60); do
            home=$(curl -fsSL "https://noktena.ru/?check=$GITHUB_RUN_ID" || true)
            product=$(curl -fsSL "https://noktena.ru/product.html?check=$GITHUB_RUN_ID" || true)
            adm=$(curl -fsSL "https://noktena.ru/admin/?check=$GITHUB_RUN_ID" || true)
            helper=$(curl -fsSL "https://noktena.ru/assets/category-settings-ui.js?check=$GITHUB_RUN_ID" || true)
            if printf '%s' "$home" | grep -q 'category-settings-ui.js?v=20260921-delivery4' && printf '%s' "$product" | grep -q 'category-settings-ui.js?v=20260921-delivery4' && printf '%s' "$adm" | grep -q 'deliverySettingsOpen' && printf '%s' "$adm" | grep -q 'admin-logo' && printf '%s' "$helper" | grep -q 'data-global-delivery'; then
              exit 0
            fi
            sleep 5
          done
          echo 'Final Pages files were not published in time' >&2
          exit 1

      - name: Render live admin and storefront in Chrome
        run: |
          set -euxo pipefail
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)

          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=15000 --dump-dom "https://noktena.ru/admin/?verify=$GITHUB_RUN_ID" > /tmp/admin.html
          grep -q 'Сервер готов' /tmp/admin.html
          grep -q 'deliverySettingsOpen' /tmp/admin.html
          grep -q 'admin-logo' /tmp/admin.html
          grep -q 'Стоимость доставки' /tmp/admin.html
          grep -q 'Стоимость подъёма' /tmp/admin.html
          grep -q 'Доплата за подъём дивана' /tmp/admin.html

          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=22000 --dump-dom "https://noktena.ru/#delivery" > /tmp/home.html
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=22000 --dump-dom "https://noktena.ru/product.html?kind=furniture&id=24177" > /tmp/product.html

          python3 - <<'PY'
          from pathlib import Path
          for name in ('/tmp/home.html','/tmp/product.html'):
              p=Path(name)
              s=p.read_text(encoding='utf-8').replace('\u00a0',' ').replace('\u202f',' ')
              p.write_text(s,encoding='utf-8')
          PY

          ! grep -q 'Каталог временно не загрузился' /tmp/home.html
          grep -q 'data-global-delivery="1500:600:400:0"' /tmp/home.html
          grep -q '1 500 ₽' /tmp/home.html
          grep -q '600 ₽' /tmp/home.html
          grep -q 'Подъём дивана' /tmp/home.html
          grep -q '400 ₽' /tmp/home.html

          ! grep -q 'Каталог временно не загрузился' /tmp/product.html
          grep -q 'global-delivery-product' /tmp/product.html
          grep -q 'Доставка и подъём' /tmp/product.html
          grep -q '1 500 ₽' /tmp/product.html
          grep -q '600 ₽' /tmp/product.html
          grep -q '400 ₽' /tmp/product.html
