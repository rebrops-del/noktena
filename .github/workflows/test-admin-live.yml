name: Test live admin
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'admin/**'
      - 'assets/category-settings-ui.js'
      - 'assets/admin-mattress-thumbs/**'
      - '.github/workflows/test-admin-live.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Static admin checks
        run: |
          set -euxo pipefail
          node --check admin/admin.js
          node --check admin/admin-enhancements.js
          node --check admin/orders.js
          node --check assets/category-settings-ui.js
          grep -q 'admin-proxy-v2-production.up.railway.app' admin/admin.js
          grep -q 'Добавить карточку' admin/index.html
          grep -q 'Плашка на карточке' admin/admin-enhancements.js
          grep -q 'Хит продаж' admin/admin-enhancements.js
          grep -q 'Распродажа' admin/admin-enhancements.js
          grep -q 'Последняя штука' admin/admin-enhancements.js
          grep -q 'Наматрасник' admin/admin-enhancements.js
          grep -q 'Матрас Mega холкон TFK' admin/admin-enhancements.js
          test -s assets/admin-mattress-thumbs/r5-c2.webp
          ! grep -R -E 'SUPABASE_SERVICE_ROLE_KEY|service_role' admin/index.html admin/admin.js admin/admin.css admin/admin-enhancements.js

      - name: Check Railway API
        run: |
          set -euxo pipefail
          API='https://admin-proxy-v2-production.up.railway.app/api/noktena-admin'
          curl -sS --fail --max-time 30 -H 'Origin: https://noktena.ru' "$API?action=health" -o /tmp/health.json -D /tmp/health.headers
          node -e "const x=require('/tmp/health.json'); if(x.ok!==true || Number(x.version)<6) { console.error(x); process.exit(1) }"
          grep -qi 'access-control-allow-origin:' /tmp/health.headers

      - name: Wait for live admin deployment
        run: |
          set -euxo pipefail
          for i in $(seq 1 40); do
            html=$(curl -sS -L --max-time 20 "https://noktena.ru/admin/?smoke=$GITHUB_RUN_ID" || true)
            enhance=$(curl -sS -L --max-time 20 "https://noktena.ru/admin/admin-enhancements.js?smoke=$GITHUB_RUN_ID" || true)
            badge=$(curl -sS -L --max-time 20 "https://noktena.ru/assets/category-settings-ui.js?smoke=$GITHUB_RUN_ID" || true)
            orders=$(curl -sS -L --max-time 20 "https://noktena.ru/admin/orders.js?smoke=$GITHUB_RUN_ID" || true)
            if printf '%s' "$html" | grep -q 'admin-enhancements.js?v=9' \
              && printf '%s' "$html" | grep -q 'orders.js?v=3' \
              && printf '%s' "$enhance" | grep -q 'Плашка на карточке' \
              && printf '%s' "$enhance" | grep -q 'admin-mattress-thumbs' \
              && printf '%s' "$badge" | grep -q 'product-promo-badge' \
              && printf '%s' "$orders" | grep -q 'lift_qty'; then
              curl -sS --fail --max-time 20 "https://noktena.ru/assets/admin-mattress-thumbs/r5-c2.webp?smoke=$GITHUB_RUN_ID" -o /tmp/topper.webp
              test -s /tmp/topper.webp
              exit 0
            fi
            sleep 5
          done
          echo 'live admin deployment did not become ready' >&2
          exit 1

      - name: Render live admin in Chrome
        run: |
          set -euxo pipefail
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=8000 --dump-dom "https://noktena.ru/admin/?run=$GITHUB_RUN_ID" > /tmp/admin.html
          grep -q 'Добро пожаловать' /tmp/admin.html
          grep -q 'Сервер готов' /tmp/admin.html

      - name: Render public storefront in Chrome
        run: |
          set -euxo pipefail
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=12000 --dump-dom "https://noktena.ru/?run=$GITHUB_RUN_ID" > /tmp/home.html
          ! grep -q 'Каталог временно не загрузился' /tmp/home.html
          grep -q 'product-open-card' /tmp/home.html
          grep -q 'class="f-card' /tmp/home.html
