name: Temporary product detail repair

on:
  push:
    paths:
      - '.github/workflows/temp-product-detail-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix product detail JavaScript and cache versions
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('assets/product-detail.js')
          s=p.read_text(encoding='utf-8')
          old=":'';}}\n  }\n\n  function renderMattress(product){"
          new=":'';}\n  }\n\n  function renderMattress(product){"
          if old not in s:
              raise SystemExit('Expected product-detail syntax marker not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          for file in ['index.html','product.html']:
              p=Path(file)
              s=p.read_text(encoding='utf-8')
              s=s.replace('assets/font-refresh.css?v=20260918-1','assets/font-refresh.css?v=20260918-2')
              if file=='product.html':
                  s=s.replace('assets/product-detail.js?v=20260918-premium2','assets/product-detail.js?v=20260918-premium3')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Validate JavaScript
        run: node --check assets/product-detail.js
      - name: Commit repair
        run: |
          git config user.name 'rebrops-del'
          git config user.email 'rebrops@gmail.com'
          git add assets/product-detail.js index.html product.html
          git commit -m 'Fix product detail loading and tune typography cache'
          git pull --rebase origin main
          git push origin main
