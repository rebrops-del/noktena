name: Apply NOKTENA catalog v2

on:
  push:
    paths:
      - '.github/workflows/apply-catalog-v2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integrate category tabs and furniture catalog
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='<link rel="stylesheet" href="assets/catalog-v2.css?v=20260918-1">'
          if css not in s:
              s=s.replace('</head>',css+'\n</head>',1)
          tabs='<div id="shopTabsMount"></div>'
          if tabs not in s:
              s=s.replace('</nav>','</nav>\n'+tabs,1)
          hits='''<section class="section home-hits" id="homeHits"><div class="wrap"><div class="home-hits-head"><div><h2>Хиты продаж</h2><p>Популярные модели из каталога НОКТЕНА. Перейдите в нужный раздел, чтобы посмотреть весь ассортимент.</p></div></div><div id="homeHitsGrid" class="f-grid"><div class="f-loading">Загружаем хиты продаж…</div></div><div class="home-hits-actions"><a class="shop-mini-link" href="#mattresses" data-home-link="mattresses">Все матрасы</a><a class="shop-mini-link" href="#beds" data-home-link="beds">Все кровати</a><a class="shop-mini-link" href="#sofas" data-home-link="sofas">Все диваны</a></div></div></section>'''
          marker='<section class="section catalog" id="catalog">'
          if 'id="homeHits"' not in s:
              if marker not in s: raise SystemExit('catalog marker not found')
              s=s.replace(marker,hits+'\n'+marker,1)
          furniture='''<section class="section furniture-catalog" id="furnitureCatalog"><div class="wrap"><div class="f-head"><div><h2 id="furnitureTitle">Кровати</h2><p id="furnitureDesc">Загружаем каталог…</p></div></div><div class="f-controls"><input id="fSearch" type="search" placeholder="Поиск по названию или характеристикам…" autocomplete="off"><select id="fSubtype"><option value="">Все диваны</option><option value="Прямой">Прямые</option><option value="Угловой">Угловые</option></select><select id="fSort"><option value="price-asc">Сначала дешевле</option><option value="price-desc">Сначала дороже</option><option value="name">По названию</option></select></div><div id="furnitureCount" class="f-count"></div><div id="furnitureGrid" class="f-grid"><div class="f-loading">Загружаем каталог…</div></div><div id="furniturePagination"></div></div></section>'''
          cta='<section class="section"><div class="wrap"><div class="cta">'
          if 'id="furnitureCatalog"' not in s:
              if cta not in s: raise SystemExit('CTA marker not found')
              s=s.replace(cta,furniture+'\n'+cta,1)
          js='<script src="assets/catalog-v2.js?v=20260918-1"></script>'
          if js not in s:
              s=s.replace('</body>',js+'\n</body>',1)
          # Broaden homepage copy for the expanded assortment.
          s=s.replace('Комфортный сон начинается с правильного матраса','Комфортный сон начинается с правильного выбора')
          s=s.replace('Поможем подобрать матрас под ваши потребности: консультация, честные рекомендации и быстрая доставка по Екатеринбургу и ближайшим районам.','Матрасы, кровати и диваны для комфортного сна и отдыха. Поможем подобрать подходящий вариант и организуем доставку по Екатеринбургу и ближайшим районам.')
          s=s.replace('Перейти в каталог <span aria-hidden="true">→</span>','Перейти в каталог <span aria-hidden="true">→</span>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name 'rebrops-del'
          git config user.email 'rebrops@gmail.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No index changes'
            exit 0
          fi
          git commit -m 'Add category tabs and furniture catalog to NOKTENA'
          git push
