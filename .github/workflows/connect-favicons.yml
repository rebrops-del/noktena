name: Connect Noktena favicons

on:
  push:
    paths:
      - '.github/workflows/connect-favicons.yml'

permissions:
  contents: write

jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add favicon links to head
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<meta name="theme-color" content="#0A8D55">'
          lines = [
              marker,
              '<link rel="icon" href="/favicon.ico" sizes="any">',
              '<link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png">',
              '<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">',
              '<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">',
              '<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">',
              '<link rel="manifest" href="/site.webmanifest">',
              '<meta name="msapplication-TileColor" content="#0A8D55">',
              '<meta name="msapplication-config" content="/browserconfig.xml">',
          ]
          block = '\n'.join(lines)
          assert s.count(marker) == 1, f'theme marker count={s.count(marker)}'
          assert '/favicon.ico' not in s, 'favicons already connected'
          s = s.replace(marker, block)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify favicon files and markup
        run: |
          test -f favicon.ico
          test -f favicon-16x16.png
          test -f favicon-32x32.png
          test -f favicon-48x48.png
          test -f apple-touch-icon.png
          test -f android-chrome-192x192.png
          test -f android-chrome-512x512.png
          test -f mstile-150x150.png
          test -f site.webmanifest
          test -f browserconfig.xml
          grep -q '/favicon.ico' index.html
          grep -q '/site.webmanifest' index.html

      - name: Remove one-time workflow and publish
        run: |
          rm -f .github/workflows/connect-favicons.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Connect Noktena favicons"
          git push origin HEAD:main
