name: Add mobile city picker
on:
  push:
    paths:
      - '.github/workflows/mobile-city-picker.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add mobile city selector to main and product pages
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main = Path('index.html')
          s = main.read_text(encoding='utf-8')
          anchor = '@media(max-width:680px){.site-top-meta .site-top-divider,.site-top-meta .site-top-email{display:none}.city-picker summary{font-size:11px}.city-popover{right:-6px;width:240px}}\n</style>'
          insert = '''@media(max-width:680px){.site-top-meta .site-top-divider,.site-top-meta .site-top-email{display:none}.city-picker summary{font-size:11px}.city-popover{right:-6px;width:240px}}
@media(max-width:620px){
  .top{display:block!important}
  .top .wrap{min-height:44px!important;justify-content:flex-start!important;padding:0 2px}
  .top .wrap>span:first-child{display:none!important}
  .site-top-meta{width:100%;justify-content:flex-start!important}
  .site-top-meta>.site-top-divider,.site-top-meta>.site-top-warehouse,.site-top-meta>.site-top-email,.site-top-meta>a[href^="tel:"]{display:none!important}
  .city-picker summary{min-height:44px;font-size:12px!important}
  .city-popover{left:0;right:auto;top:calc(100% + 8px);width:min(260px,calc(100vw - 28px))}
  .city-popover:before{left:22px;right:auto}
}
</style>'''
          if anchor not in s:
              raise SystemExit('index city style anchor not found')
          s = s.replace(anchor, insert, 1)
          main.write_text(s, encoding='utf-8')

          product = Path('product.html')
          p = product.read_text(encoding='utf-8')
          anchor2 = '@media(max-width:680px){.site-top-meta .site-top-divider,.site-top-meta .site-top-email{display:none}.city-picker summary{font-size:11px}.city-popover{right:-6px;width:240px}}\n</style>'
          insert2 = '''@media(max-width:680px){.site-top-meta .site-top-divider,.site-top-meta .site-top-email{display:none}.city-picker summary{font-size:11px}.city-popover{right:-6px;width:240px}}
@media(max-width:620px){
  .pd-top{display:block!important}
  .pd-top .pd-wrap{min-height:44px!important;justify-content:flex-start!important}
  .pd-top .pd-wrap>span:first-child{display:none!important}
  .site-top-meta{width:100%;justify-content:flex-start!important}
  .site-top-meta>.site-top-divider,.site-top-meta>.site-top-warehouse,.site-top-meta>.site-top-email,.site-top-meta>a[href^="tel:"]{display:none!important}
  .city-picker summary{min-height:44px;font-size:12px!important}
  .city-popover{left:0;right:auto;top:calc(100% + 8px);width:min(260px,calc(100vw - 28px))}
  .city-popover:before{left:22px;right:auto}
}
</style>'''
          if anchor2 not in p:
              raise SystemExit('product city style anchor not found')
          p = p.replace(anchor2, insert2, 1)
          product.write_text(p, encoding='utf-8')
          PY
      - name: Commit changes and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html product.html
          git commit -m 'Show city selector on mobile' || true
          git rm .github/workflows/mobile-city-picker.yml
          git commit -m 'Remove temporary mobile city workflow'
          git push
