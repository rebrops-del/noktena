name: Patch admin order tabs
on:
  push:
    paths:
      - '.github/workflows/patch-admin-orders-tabs.yml'
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Bump order UI assets and tests
        run: |
          set -euxo pipefail
          sed -i 's/orders.js?v=2/orders.js?v=3/g' admin/index.html
          sed -i "s/orders.js?v=2/orders.js?v=3/g" .github/workflows/test-admin-live.yml
          grep -q 'orders.js?v=3' admin/index.html
          grep -q 'orders.js?v=3' .github/workflows/test-admin-live.yml
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin/index.html .github/workflows/test-admin-live.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish tabbed orders admin UI'
          git push
