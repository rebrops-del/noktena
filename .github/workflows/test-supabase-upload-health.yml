name: Test Supabase upload health

on:
  push:
    paths:
      - '.github/workflows/test-supabase-upload-health.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Call upload health endpoint
        run: |
          set -euxo pipefail
          curl -sS -D /tmp/headers.txt 'https://oldtlbkrftflfthfsqdv.supabase.co/functions/v1/admin-upload-image?health=1' -o /tmp/body.txt
          cat /tmp/headers.txt
          cat /tmp/body.txt
