name: Apply Noktena brand assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-noktena-brand-assets.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify and switch brand images
        run: |
          python3 - <<'PY'
          from pathlib import Path

          logo = Path('assets/logo-noktena.webp')
          hero = Path('assets/hero-noktena.webp')
          for p in (logo, hero):
              b = p.read_bytes()
              if len(b) < 5000 or b[:4] != b'RIFF' or b[8:12] != b'WEBP':
                  raise SystemExit(f'Invalid WebP asset: {p}')

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_logo = '<a class="brand brand-logo" href="#top" aria-label="НОКТЕНА"><span class="noktena-emblem" aria-hidden="true"></span><span class="noktena-lockup"><span class="noktena-word">НОКТЕНА</span><span class="noktena-sub">Федеральная онлайн-сеть</span></span></a>'
          new_logo = '<a class="brand brand-logo" href="#top" aria-label="НОКТЕНА"><img class="noktena-logo-img" src="assets/logo-noktena.webp?v=20260908-final2" alt="НОКТЕНА — федеральная онлайн-сеть" width="360" height="113"></a>'
          if s.count(old_logo) != 1:
              raise SystemExit(f'Expected exactly one current logo, found {s.count(old_logo)}')
          s = s.replace(old_logo, new_logo, 1)

          old_hero = '<img src="assets/hero-consultant-mattress.webp?v=20260905-hero-crop13" alt="Консультант НОКТЕНА рядом с матрасом" width="720" height="678" loading="eager" fetchpriority="high">'
          new_hero = '<img src="assets/hero-noktena.webp?v=20260908-final2" alt="Консультант НОКТЕНА рядом с матрасом" width="520" height="477" loading="eager" fetchpriority="high">'
          if s.count(old_hero) != 1:
              raise SystemExit(f'Expected exactly one current hero image, found {s.count(old_hero)}')
          s = s.replace(old_hero, new_hero, 1)

          css = '''

/* noktena-approved-image-logo-v2 */
.brand.brand-logo{display:flex;align-items:center;flex:0 0 auto;text-decoration:none;max-width:300px;min-width:0}
.noktena-logo-img{display:block;width:275px;max-width:100%;height:auto;object-fit:contain}
@media(max-width:900px){.brand.brand-logo{max-width:240px}.noktena-logo-img{width:230px}}
@media(max-width:620px){.brand.brand-logo{max-width:190px}.noktena-logo-img{width:180px}}
'''
          if '/* noktena-approved-image-logo-v2 */' not in s:
              s = s.replace('</style>', css + '\n</style>', 1)

          if 'assets/logo-noktena.webp?v=20260908-final2' not in s:
              raise SystemExit('Logo reference missing after patch')
          if 'assets/hero-noktena.webp?v=20260908-final2' not in s:
              raise SystemExit('Hero reference missing after patch')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit verified switch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-noktena-brand-assets.yml
          git add index.html
          git diff --cached --check
          git commit -m 'Use approved Noktena logo and hero images'
          git push
