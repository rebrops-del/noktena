name: Publish Unified Hit Badge
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/bump-unified-hit-badge.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump stylesheet cache key
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('assets/post-rollback-fixes.css?v=20260922-cardfix2','assets/post-rollback-fixes.css?v=20260922-hituniform1')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        run: grep -q 'post-rollback-fixes.css?v=20260922-hituniform1' index.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Load unified bestseller badge style'
          git push
