name: Load Global Promo And Topper
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/load-global-promo-and-topper.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch script links
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('admin/index.html')
          s=p.read_text(encoding='utf-8')
          link='  <script src="./global-promo-settings.js?v=20260922-1" defer></script>\n'
          if 'global-promo-settings.js' not in s:
              s=s.replace('  <script src="./orders.js?v=3" defer></script>\n', '  <script src="./orders.js?v=3" defer></script>\n'+link)
              p.write_text(s,encoding='utf-8')

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          additions='''<script src="assets/topper-catalog-image-fix.js?v=20260922-topper3"></script>\n<script src="assets/global-promo-runtime.js?v=20260922-globalpromo1"></script>\n'''
          if 'global-promo-runtime.js' not in s:
              s=s.replace('</body>', additions+'</body>')
              p.write_text(s,encoding='utf-8')

          p=Path('product.html')
          s=p.read_text(encoding='utf-8')
          link='<script src="assets/global-promo-runtime.js?v=20260922-globalpromo1"></script>\n'
          if 'global-promo-runtime.js' not in s:
              s=s.replace('</body>', link+'</body>')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        run: |
          grep -q 'global-promo-settings.js?v=20260922-1' admin/index.html
          grep -q 'topper-catalog-image-fix.js?v=20260922-topper3' index.html
          grep -q 'global-promo-runtime.js?v=20260922-globalpromo1' index.html
          grep -q 'global-promo-runtime.js?v=20260922-globalpromo1' product.html
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin/index.html index.html product.html
          git commit -m 'Load global promo controls and topper images'
          git push
