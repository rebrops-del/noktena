name: Apply approved Noktena branding

on:
  push:
    branches: [rebrand-fix]
    paths:
      - '.github/workflows/apply-approved-brand.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebrand-fix

      - name: Patch header logo and hero only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if 'const oldPrice=n=>Math.round((Number(n)/0.7)/100)*100;' not in s: raise SystemExit('sale guard failed')
          logo_re = re.compile(r'<a class="brand brand-logo" href="#top" aria-label="НОКТЕНА">.*?</a>')
          logo_new = '<a class="brand brand-logo" href="#top" aria-label="НОКТЕНА"><img class="noktena-logo-img" src="assets/logo-noktena.png?v=20260908-brand3" alt="НОКТЕНА — федеральная онлайн-сеть" width="1500" height="460"></a>'
          s, n = logo_re.subn(logo_new, s, count=1)
          if n != 1: raise SystemExit(f'logo replace={n}')
          old = '<img src="assets/hero-consultant-mattress.webp?v=20260905-hero-crop13" alt="Консультант НОКТЕНА рядом с матрасом" width="720" height="678" loading="eager" fetchpriority="high">'
          new = '<img src="assets/hero-noktena.webp?v=20260908-brand3" alt="Консультант НОКТЕНА рядом с матрасом" width="960" height="880" loading="eager" fetchpriority="high">'
          if old not in s: raise SystemExit('old hero missing')
          s = s.replace(old,new,1)
          css='''\n/* noktena-approved-logo-v1 */\n.brand.brand-logo{display:inline-flex;align-items:center;flex:0 0 auto;text-decoration:none;gap:0}\n.noktena-logo-img{display:block;width:auto;height:58px;max-width:228px;object-fit:contain}\n@media(max-width:760px){.noktena-logo-img{height:52px;max-width:205px}}\n@media(max-width:520px){.noktena-logo-img{height:44px;max-width:174px}}\n'''
          if '/* noktena-approved-logo-v1 */' not in s: s=s.replace('</style>',css+'\n</style>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit final branding and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-approved-brand.yml
          git add index.html
          git commit -m 'Apply approved Noktena logo and hero'
          git push origin HEAD:rebrand-fix
