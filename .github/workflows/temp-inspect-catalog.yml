name: Temporary correct furniture color photos

on:
  push:
    paths:
      - '.github/workflows/temp-inspect-catalog.yml'

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests beautifulsoup4
      - name: Correct source color label handling
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/enrich_furniture_color_images.py')
          s=p.read_text(encoding='utf-8')
          old='''def selected_label_from_block(block, control_name, value, known_label=""):\n    for control in parse_controls(block):\n        if control["name"] != control_name or "цвет" not in control["caption"].lower():\n            continue\n        for option in control["options"]:\n            if option["value"] == str(value) and option["label"]:\n                return option["label"]\n        for option in control["options"]:\n            if option["selected"] and option["label"]:\n                return option["label"]\n        caption = control["caption"]\n        low = caption.lower().replace("ё", "е")\n        prefixes = ["цвет фасада", "цвет корпуса", "цвет обивки", "цвет ткани", "цвет"]\n        for prefix in prefixes:\n            if low.startswith(prefix):\n                rest = clean(caption[len(prefix):].lstrip(" :-"))\n                if rest:\n                    return rest\n    return clean(known_label)\n'''
          new='''def selected_label_from_block(block, control_name, value, known_label=""):\n    # When the source control already exposes a label (select option/title), it is\n    # the authoritative name for the value we just posted. Returned Berhouse\n    # markup may preselect the next option, so reading its selected label first\n    # can shift color names by one position.\n    known = clean(known_label)\n    generic = {"цвет", "фасада", "корпуса", "обивки", "ткани", "цвет фасада", "цвет корпуса", "цвет обивки", "цвет ткани"}\n    if known and known.lower().replace("ё", "е") not in generic:\n        return known\n\n    for control in parse_controls(block):\n        if control["name"] != control_name or "цвет" not in control["caption"].lower():\n            continue\n        caption = control["caption"]\n        low = caption.lower().replace("ё", "е")\n        prefixes = ["цвет фасада", "цвет корпуса", "цвет обивки", "цвет ткани", "цвет"]\n        for prefix in prefixes:\n            if low.startswith(prefix):\n                rest = clean(caption[len(prefix):].lstrip(" :-"))\n                if rest and rest.lower().replace("ё", "е") not in generic:\n                    return rest\n        for option in control["options"]:\n            if option["value"] == str(value) and option["label"]:\n                return option["label"]\n        for option in control["options"]:\n            if option["selected"] and option["label"]:\n                return option["label"]\n    return known\n'''
          if old not in s:
              if 'authoritative name for the value we just posted' not in s:
                  raise SystemExit('Expected label function not found')
          else:
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Rebuild exact color to photo mappings
        run: python scripts/enrich_furniture_color_images.py
      - name: Validate mappings
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('data/furniture.json').read_text(encoding='utf-8'))
          beds=data.get('beds',[]);sofas=data.get('sofas',[]);allp=beds+sofas
          mapped=[p for p in allp if p.get('colorImages')]
          total=sum(len(p.get('colorImages') or {}) for p in mapped)
          excluded=['горизонт мини','екатеринбург мини','стандарт мини','мета с матрасом','эко стандарт','эко екатеринбург']
          bad=[p.get('title') for p in beds if any(x in str(p.get('title','')).lower().replace('ё','е') for x in excluded)]
          if bad: raise SystemExit(f'Excluded beds returned: {bad}')
          if len(mapped)<150 or total<1000: raise SystemExit(f'Too few mappings: {len(mapped)}, {total}')
          sample=next((p for p in allp if str(p.get('sourceId'))=='24190'),None)
          if sample:
              m=sample.get('colorImages') or {}
              expected={
                'Бежевый':'24190_420811.jpg',
                'Белый':'24190_420791.jpg',
                'Бирюзовый':'24190_420796.jpg',
                'Бордо':'24190_420792.jpg',
                'Коричневый':'24190_420813.jpg',
                'Светло серый':'24190_420793.jpg',
                'Серый':'24190_420789.jpg',
                'Темно серый':'24190_420790.jpg',
              }
              print('Sample 24190:',m)
              for color,ending in expected.items():
                  if color not in m or not str(m[color]).endswith(ending):
                      raise SystemExit(f'Incorrect 24190 mapping for {color}: {m.get(color)}')
          for p in mapped:
              images=set(p.get('images') or [])
              if any(url not in images for url in (p.get('colorImages') or {}).values()):
                  raise SystemExit(f"Mapped photo missing from detail gallery: {p.get('title')}")
          print(f'Validated beds={len(beds)}, sofas={len(sofas)}, mapped_products={len(mapped)}, mappings={total}')
          PY
      - name: Commit corrected mappings
        run: |
          git config user.name 'rebrops-del'
          git config user.email 'rebrops@gmail.com'
          git add scripts/enrich_furniture_color_images.py data/furniture.json
          git commit -m 'Correct furniture color photo mappings'
          git pull --rebase origin main
          git push origin main
