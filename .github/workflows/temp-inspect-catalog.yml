name: Temporary Berhouse dynamic color label inspect

on:
  push:
    paths:
      - '.github/workflows/temp-inspect-catalog.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests
      - name: Inspect dynamic color markup
        run: |
          python - <<'PY'
          import requests
          S=requests.Session();S.headers.update({'User-Agent':'Mozilla/5.0','X-Requested-With':'XMLHttpRequest'})
          S.get('https://m.berhouse.ru/eshop/item/23284/',timeout=30)
          for fields in ({'attr11':'5759'},{'attr11':'5759','attr7':'3020'},{'attr11':'5759','attr7':'6816'}):
            d=S.post('https://m.berhouse.ru/eshop/getcombo/23284',files={k:(None,v) for k,v in fields.items()},timeout=30).json()
            print('\nFIELDS',fields,'CID',d.get('combinationId'))
            print(d.get('cominationsBlock','')[:16000])
          PY
