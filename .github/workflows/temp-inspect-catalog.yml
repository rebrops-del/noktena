name: Temporary finalize furniture color photos

on:
  push:
    paths:
      - '.github/workflows/temp-inspect-catalog.yml'

permissions:
  contents: write
  actions: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for earlier furniture import
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID=35336870844
          for i in $(seq 1 180); do
            status=$(curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" \
              | python -c "import sys,json; print(json.load(sys.stdin).get('status','unknown'))")
            echo "Earlier import status: ${status}"
            if [ "${status}" = "completed" ]; then
              break
            fi
            sleep 10
          done
          if [ "${status}" != "completed" ]; then
            echo "Earlier import did not finish in time"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Remove intentionally excluded beds
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path=Path('data/furniture.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          excluded=[
              'горизонт мини','екатеринбург мини','стандарт мини',
              'мета с матрасом','эко стандарт','эко екатеринбург',
          ]
          def low(v): return str(v or '').lower().replace('ё','е')
          before=len(data.get('beds',[]))
          data['beds']=[p for p in data.get('beds',[]) if not any(x in low(p.get('title')) for x in excluded)]
          after=len(data['beds'])
          path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(f'Beds: {before} -> {after}; removed {before-after}')
          leftovers=[p.get('title') for p in data['beds'] if any(x in low(p.get('title')) for x in excluded)]
          if leftovers:
              raise SystemExit(f'Excluded beds remain: {leftovers}')
          PY

      - name: Map selectable colors to source product photos
        run: python scripts/enrich_furniture_color_images.py

      - name: Validate final furniture data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data=json.loads(Path('data/furniture.json').read_text(encoding='utf-8'))
          beds=data.get('beds',[]); sofas=data.get('sofas',[]); allp=beds+sofas
          excluded=['горизонт мини','екатеринбург мини','стандарт мини','мета с матрасом','эко стандарт','эко екатеринбург']
          def low(v): return str(v or '').lower().replace('ё','е')
          bad=[p.get('title') for p in beds if any(x in low(p.get('title')) for x in excluded)]
          mapped=[p for p in allp if p.get('colorImages')]
          mappings=sum(len(p.get('colorImages') or {}) for p in mapped)
          sample=next((p for p in allp if str(p.get('sourceId'))=='24190'),None)
          print('Beds:',len(beds),'Sofas:',len(sofas),'Mapped products:',len(mapped),'Color-photo mappings:',mappings)
          if sample:
              print('Sample 24190 mappings:',sample.get('colorImages'))
          if bad:
              raise SystemExit(f'Excluded beds found: {bad}')
          if len(mapped) < 10 or mappings < 30:
              raise SystemExit('Too few verified color-photo mappings')
          if sample and len(sample.get('colorImages') or {}) < 4:
              raise SystemExit('Known sample 24190 has too few color mappings')
          for product in mapped:
              images=set(product.get('images') or [])
              missing=[url for url in (product.get('colorImages') or {}).values() if url not in images]
              if missing:
                  raise SystemExit(f"Color images not in gallery for {product.get('title')}: {missing[:2]}")
          PY

      - name: Commit final catalog
        run: |
          git config user.name 'rebrops-del'
          git config user.email 'rebrops@gmail.com'
          git add data/furniture.json
          if git diff --cached --quiet; then
            echo 'No furniture data changes'
            exit 0
          fi
          git commit -m 'Map furniture colors to source product photos'
          git pull --rebase origin main
          git push origin main
