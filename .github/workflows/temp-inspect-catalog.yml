name: Temporary NOKTENA color photo patch

on:
  push:
    paths:
      - '.github/workflows/temp-inspect-catalog.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch importer, enricher and frontend
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # 1) Permanently keep the six intentionally removed bed models out of future imports.
          p=Path('scripts/import_berhouse_furniture.py')
          s=p.read_text(encoding='utf-8')
          old='''                target = "beds" if p["category"] == "beds" else "sofas"\n                result[target].append(p)'''
          new='''                target = "beds" if p["category"] == "beds" else "sofas"\n                excluded_bed_parts = [\n                    "горизонт мини", "екатеринбург мини", "стандарт мини",\n                    "мета с матрасом", "эко стандарт", "эко екатеринбург",\n                ]\n                normalized_title = p.get("title", "").lower().replace("ё", "е")\n                if target == "beds" and any(part.replace("ё", "е") in normalized_title for part in excluded_bed_parts):\n                    print(f"  SKIP excluded bed: {p.get('title')}")\n                    seen.add(url)\n                    continue\n                result[target].append(p)'''
          if old in s:
              s=s.replace(old,new,1)
          elif 'excluded_bed_parts' not in s:
              raise SystemExit('Importer insertion marker not found')
          p.write_text(s,encoding='utf-8')

          # 2) Ensure color-specific photos are also available inside the detail-page gallery.
          p=Path('scripts/enrich_furniture_color_images.py')
          s=p.read_text(encoding='utf-8')
          old='''            product["colorImages"] = mapping\n            product["colors"] = unique(existing_colors + list(mapping.keys()))\n            mapped_products += 1'''
          new='''            product["colorImages"] = mapping\n            product["colors"] = unique(existing_colors + list(mapping.keys()))\n            images = list(product.get("images") or [])\n            for photo in mapping.values():\n                if photo and photo not in images:\n                    images.append(photo)\n            product["images"] = images\n            mapped_products += 1'''
          if old in s:
              s=s.replace(old,new,1)
          elif 'for photo in mapping.values()' not in s:
              raise SystemExit('Enricher image insertion marker not found')
          p.write_text(s,encoding='utf-8')

          # 3) Catalog cards: switching a color changes the actual product photo.
          p=Path('assets/catalog-v2.js')
          s=p.read_text(encoding='utf-8')
          marker='''  function cardDetailsMarkup(product){'''
          helper='''  function colorImageFor(product,color){\n    if(!color)return '';const map=product?.colorImages||{};if(map[color])return map[color];const wanted=String(color).toLowerCase().replace(/ё/g,'е').replace(/[^a-zа-я0-9]+/g,'');const key=Object.keys(map).find(k=>String(k).toLowerCase().replace(/ё/g,'е').replace(/[^a-zа-я0-9]+/g,'')===wanted);return key?map[key]:'';\n  }\n  function updateCardImage(card,product,color){\n    const src=colorImageFor(product,color);if(!src)return;const img=$('.f-gallery img',card);if(!img||img.getAttribute('src')===src)return;const preload=new Image();preload.onload=()=>{img.classList.add('is-changing');setTimeout(()=>{img.src=src;img.classList.remove('is-changing')},90);};preload.onerror=()=>{};preload.src=src;\n  }\n'''
          if 'function updateCardImage(' not in s:
              if marker not in s: raise SystemExit('Catalog helper marker not found')
              s=s.replace(marker,helper+marker,1)
          old='''    const imgs=uniq(product.images);const first=imgs[0]||'assets/hero-noktena-final.png?v=20260908-final2';const quick=chooseSpecs(product);const category=product.category==='beds'?'Кровать':'Диван';const link=detailUrl(product);\n    const colors=uniq(product.colors?.length?product.colors:(product.variants||[]).map(v=>v.color));const sizes=sortSizes(product.sizes?.length?product.sizes:(product.variants||[]).map(v=>v.size));const initial=preferredVariant(product,colors[0]||'',sizes[0]||'');const price=initial?.price||product.price;'''
          new='''    const imgs=uniq(product.images);const quick=chooseSpecs(product);const category=product.category==='beds'?'Кровать':'Диван';const link=detailUrl(product);\n    const colors=uniq(product.colors?.length?product.colors:(product.variants||[]).map(v=>v.color));const sizes=sortSizes(product.sizes?.length?product.sizes:(product.variants||[]).map(v=>v.size));const initial=preferredVariant(product,colors[0]||'',sizes[0]||'');const price=initial?.price||product.price;const first=colorImageFor(product,colors[0]||'')||imgs[0]||'assets/hero-noktena-final.png?v=20260908-final2';'''
          if old in s:
              s=s.replace(old,new,1)
          elif 'const first=colorImageFor(product' not in s:
              raise SystemExit('Catalog initial image marker not found')
          old="  function updateCardVariant(card){const product=productById(card?.dataset.productId);if(!product)return;const color=card.dataset.selectedColor||'';const size=card.dataset.selectedSize||'';const variant=preferredVariant(product,color,size);const price=variant?.price||product.price;const el=$('[data-card-price]',card);if(el)el.textContent=rub(price);}" 
          new="  function updateCardVariant(card){const product=productById(card?.dataset.productId);if(!product)return;const color=card.dataset.selectedColor||'';const size=card.dataset.selectedSize||'';const variant=preferredVariant(product,color,size);const price=variant?.price||product.price;const el=$('[data-card-price]',card);if(el)el.textContent=rub(price);updateCardImage(card,product,color);}" 
          if old in s:
              s=s.replace(old,new,1)
          elif 'updateCardImage(card,product,color)' not in s:
              raise SystemExit('Catalog update marker not found')
          p.write_text(s,encoding='utf-8')

          # 4) Product page: color selection jumps the gallery to the matching source photo.
          p=Path('assets/product-detail.js')
          s=p.read_text(encoding='utf-8')
          marker='''  function renderFurniture(product){'''
          helper='''  function colorImageFor(product,color){\n    if(!color)return '';const map=product?.colorImages||{};if(map[color])return map[color];const wanted=String(color).toLowerCase().replace(/ё/g,'е').replace(/[^a-zа-я0-9]+/g,'');const key=Object.keys(map).find(k=>String(k).toLowerCase().replace(/ё/g,'е').replace(/[^a-zа-я0-9]+/g,'')===wanted);return key?map[key]:'';\n  }\n  function updateFurnitureImage(){\n    if(!furnitureProduct||!selectedColor)return;const src=colorImageFor(furnitureProduct,selectedColor);if(!src)return;const index=galleryImages.indexOf(src);if(index>=0){if(index!==galleryIndex)showGallery(index);return;}const img=$('#pdMainImage');const media=$('#pdMainMedia');if(img&&img.getAttribute('src')!==src){const preload=new Image();preload.onload=()=>{img.classList.add('is-changing');setTimeout(()=>{img.src=src;img.classList.remove('is-changing')},90);};preload.onerror=()=>img.classList.remove('is-changing');preload.src=src;}if(media)media.style.setProperty('--pd-bg',`url("${src.replace(/"/g,'\\\\"')}")`);$$('[data-pd-index]').forEach(el=>el.classList.remove('is-active'));\n  }\n'''
          if 'function updateFurnitureImage(' not in s:
              if marker not in s: raise SystemExit('Detail helper marker not found')
              s=s.replace(marker,helper+marker,1)
          old='''    if(!furnitureProduct)return;const variant=variantFor(furnitureProduct,selectedColor,selectedSize);'''
          new='''    if(!furnitureProduct)return;updateFurnitureImage();const variant=variantFor(furnitureProduct,selectedColor,selectedSize);'''
          if old in s:
              s=s.replace(old,new,1)
          elif 'return;updateFurnitureImage();const variant=' not in s:
              raise SystemExit('Detail update marker not found')
          p.write_text(s,encoding='utf-8')

          # 5) Cache-bust the changed JavaScript files.
          p=Path('index.html');s=p.read_text(encoding='utf-8')
          s=re.sub(r'assets/catalog-v2\\.js\\?v=[^"\\']+', 'assets/catalog-v2.js?v=20260918-color1', s)
          p.write_text(s,encoding='utf-8')
          p=Path('product.html');s=p.read_text(encoding='utf-8')
          s=re.sub(r'assets/product-detail\\.js\\?v=[^"\\']+', 'assets/product-detail.js?v=20260918-color1', s)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate JavaScript
        run: |
          node --check assets/catalog-v2.js
          node --check assets/product-detail.js
          python -m py_compile scripts/import_berhouse_furniture.py scripts/enrich_furniture_color_images.py
      - name: Commit code changes
        run: |
          git config user.name 'rebrops-del'
          git config user.email 'rebrops@gmail.com'
          git add scripts/import_berhouse_furniture.py scripts/enrich_furniture_color_images.py assets/catalog-v2.js assets/product-detail.js index.html product.html
          git commit -m 'Switch furniture photos with selected color'
          git pull --rebase origin main
          git push origin main
