name: Temporary Berhouse color JS inspect

on:
  push:
    paths:
      - '.github/workflows/temp-inspect-catalog.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect color JavaScript
        run: |
          python - <<'PY'
          import requests
          js=requests.get('https://m.berhouse.ru/files/js/full.js?v=230404094100',headers={'User-Agent':'Mozilla/5.0'},timeout=30).text
          print('LEN',len(js))
          for key in ['cobmos','combination_id','product-price','attribute_select','data-value','/eshop/','color']:
              print('\n===',key,'===')
              pos=0
              for _ in range(12):
                  i=js.lower().find(key.lower(),pos)
                  if i<0: break
                  print(js[max(0,i-900):i+1800])
                  pos=i+len(key)
          PY
