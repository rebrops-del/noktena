name: Fix furniture variant specs

on:
  push:
    paths:
      - '.github/workflows/fix-variant-specs.yml'
      - 'scripts/fix_variant_specs.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patch
        run: python3 scripts/fix_variant_specs.py

      - name: Validate patch
        run: |
          set -euo pipefail
          node --check assets/catalog-v2.js
          grep -q 'deriveFrameDimension(product,variant,label)' assets/catalog-v2.js
          grep -q 'shortTextForVariant(product,variant)' assets/catalog-v2.js
          grep -q 'summary.textContent=shortTextForVariant(product,variant)' assets/catalog-v2.js
          grep -q 'catalog-v2.js?v=20260921-variantdims2' index.html

      - name: Commit patch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/catalog-v2.js index.html
          if git diff --cached --quiet; then
            echo 'No changes needed'
            exit 0
          fi
          git commit -m 'Sync bed dimensions and summary with selected size'
          git pull --rebase origin main
          git push origin main
