name: Update mattress heading
on:
  push:
    paths:
      - '.github/workflows/update-mattress-heading.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Update mattress heading
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='Каталог матрасов и товаров для сна'
          new='Матрасы для комфортного сна'
          if old not in s:
              raise SystemExit(f'Heading not found: {old}')
          s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes and remove temporary workflow
        run: |
          rm .github/workflows/update-mattress-heading.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/update-mattress-heading.yml
          git commit -m 'Rename mattress catalog heading'
          git push origin main
