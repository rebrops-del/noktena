name: Refresh catalog mattress card formatter
on:
  push:
    paths:
      - '.github/workflows/bump-catalog-card-open.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump catalog formatter cache
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='assets/catalog-card-open.js?v=20260918-2'
          new='assets/catalog-card-open.js?v=20260918-3'
          if old not in s:
              raise SystemExit('cache key not found')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
      - name: Commit change and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refresh mattress catalog card formatting"
          git rm .github/workflows/bump-catalog-card-open.yml
          git commit -m "Remove temporary catalog formatter workflow"
          git push
