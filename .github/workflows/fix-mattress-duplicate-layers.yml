name: Fix mattress duplicate layers
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-mattress-duplicate-layers.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve repeated mattress layers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          targets = [
              Path('assets/catalog-card-open.js'),
              Path('assets/product-detail-content-polish.js'),
          ]
          old = "if(item&&!composition.includes(item))composition.push(item);"
          new = "if(item)composition.push(item);"
          for path in targets:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected 1 duplicate-filter expression, found {count}')
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY
          node --check assets/catalog-card-open.js
          node --check assets/product-detail-content-polish.js
          grep -q 'if(item)composition.push(item);' assets/catalog-card-open.js
          grep -q 'if(item)composition.push(item);' assets/product-detail-content-polish.js
      - name: Commit changes and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/catalog-card-open.js assets/product-detail-content-polish.js
          git rm .github/workflows/fix-mattress-duplicate-layers.yml
          git commit -m 'Preserve repeated mattress composition layers'
          git push origin main
