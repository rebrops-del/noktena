name: Verify category pricing and delivery live
on:
  push:
    paths:
      - '.github/workflows/verify-category-settings.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify backend and public bootstrap
        run: |
          set -euxo pipefail
          API='https://admin-proxy-v2-production.up.railway.app/api/noktena-admin'
          BOOT='https://admin-proxy-v2-production.up.railway.app/catalog-bootstrap.js'
          curl -fsS "$API?action=health" -o /tmp/health.json
          node -e "const x=require('/tmp/health.json'); if(x.ok!==true || Number(x.version)<3) process.exit(1)"
          curl -fsS "$BOOT?check=$GITHUB_RUN_ID" -o /tmp/bootstrap.js
          grep -q 'categorySettings' /tmp/bootstrap.js
          grep -q 'mattress' /tmp/bootstrap.js
          grep -q 'beds' /tmp/bootstrap.js
          grep -q 'sofas' /tmp/bootstrap.js

      - name: Wait for GitHub Pages deployment
        run: |
          set -euxo pipefail
          for i in $(seq 1 36); do
            adm=$(curl -fsSL "https://noktena.ru/admin/?check=$GITHUB_RUN_ID" || true)
            admjs=$(curl -fsSL "https://noktena.ru/admin/admin.js?check=$GITHUB_RUN_ID" || true)
            runtime=$(curl -fsSL "https://noktena.ru/assets/catalog-runtime.js?check=$GITHUB_RUN_ID" || true)
            delivery=$(curl -fsSL "https://noktena.ru/assets/category-settings-ui.js?check=$GITHUB_RUN_ID" || true)
            if printf '%s' "$adm" | grep -q 'Цены и доставка' && printf '%s' "$admjs" | grep -q 'openCategorySettings' && printf '%s' "$runtime" | grep -q 'getCategorySettings' && printf '%s' "$delivery" | grep -q 'category-rate-grid'; then
              exit 0
            fi
            sleep 5
          done
          echo 'Updated Pages files were not published in time' >&2
          exit 1

      - name: Render live admin and storefront in Chrome
        run: |
          set -euxo pipefail
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=10000 --dump-dom "https://noktena.ru/admin/?verify=$GITHUB_RUN_ID" > /tmp/admin.html
          grep -q 'Сервер готов' /tmp/admin.html
          grep -q 'Цены и доставка' /tmp/admin.html

          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=14000 --dump-dom "https://noktena.ru/#delivery" > /tmp/home.html
          ! grep -q 'Каталог временно не загрузился' /tmp/home.html
          grep -q 'category-rate-grid' /tmp/home.html
          grep -q 'Матрасы' /tmp/home.html
          grep -q 'Кровати' /tmp/home.html
          grep -q 'Диваны' /tmp/home.html

          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=14000 --dump-dom "https://noktena.ru/product.html?kind=furniture&id=24177" > /tmp/product.html
          grep -q 'category-delivery-product' /tmp/product.html
