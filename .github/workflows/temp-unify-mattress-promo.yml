name: Match mattress promo styling to furniture cards

on:
  push:
    paths:
      - '.github/workflows/temp-unify-mattress-promo.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Unify mattress promo styling
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('assets/premium-ui.css')
          s=p.read_text(encoding='utf-8')
          marker='/* Mattress promo matches furniture cards */'
          block='''\n/* Mattress promo matches furniture cards */\n.promo{display:flex!important;flex-direction:column!important;align-items:flex-end!important;gap:4px!important;padding-bottom:2px!important}\n.promo b{font-size:10px!important;background:#fff5c9!important;color:#775800!important;border:1px solid #f0dc86!important;border-radius:999px!important;padding:6px 9px!important;white-space:nowrap!important;font-weight:900!important}\n.promo span{font-size:9px!important;color:#7d8b84!important;font-weight:750!important}\n@media(max-width:430px){.promo{align-items:flex-start!important}}\n'''
          if marker not in s:
              s += block
          p.write_text(s,encoding='utf-8')

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'assets/premium-ui\.css\?v=[^"\']+', 'assets/premium-ui.css?v=20260918-promomatch1', s)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate update
        run: |
          grep -q 'Mattress promo matches furniture cards' assets/premium-ui.css
          grep -q '20260918-promomatch1' index.html
      - name: Commit changes
        run: |
          git config user.name 'rebrops-del'
          git config user.email 'rebrops@gmail.com'
          git rm -f .github/workflows/temp-unify-mattress-promo.yml
          git add assets/premium-ui.css index.html
          git commit -m 'Match mattress promo badge to furniture cards'
          git pull --rebase origin main
          git push origin main
