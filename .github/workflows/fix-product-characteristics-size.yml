name: Fix product characteristics size

on:
  push:
    paths:
      - '.github/workflows/fix-product-characteristics-size.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sync selected size in characteristics
        run: |
          python - <<'PY'
          from pathlib import Path

          js_path = Path('assets/product-detail.js')
          js = js_path.read_text(encoding='utf-8')
          old = """    const extra=$('#pdVariantSpecs');if(extra){const attrs=variant?.attributes||{};const entries=Object.entries(attrs).filter(([k,v])=>k&&v&&!['Цвет фасада','Спальное место','Размер'].includes(k)&&!/производител|артикул|sku/i.test(k));extra.innerHTML=entries.length?`<div class=\"pd-variant-note\"><b>Выбранный вариант</b><div>${selectedColor?`<span>Цвет: ${esc(selectedColor)}</span>`:''}${selectedSize?`<span>Размер: ${esc(selectedSize)}</span>`:''}${entries.slice(0,4).map(([k,v])=>`<span>${esc(k)}: ${esc(v)}</span>`).join('')}</div></div>`:'';}\n"""
          new = """    const attrs=variant?.attributes||{};\n    const normSpecKey=value=>String(value||'').trim().toLowerCase().replace(/ё/g,'е');\n    $$('.pd-spec').forEach(row=>{\n      const keyEl=row.querySelector('span'),valueEl=row.querySelector('b');\n      if(!keyEl||!valueEl)return;\n      const key=normSpecKey(keyEl.textContent);\n      if(furnitureProduct.category==='beds'&&selectedSize&&/спальн.*мест/.test(key)){valueEl.textContent=selectedSize;return;}\n      const attrKey=Object.keys(attrs).find(k=>normSpecKey(k)===key);\n      if(attrKey&&attrs[attrKey]){valueEl.textContent=attrs[attrKey];return;}\n      if(furnitureProduct.category==='beds'&&selectedSize&&(key==='размер'||key==='размеры'||key==='размер спального места'))valueEl.textContent=selectedSize;\n    });\n    const extra=$('#pdVariantSpecs');if(extra){const entries=Object.entries(attrs).filter(([k,v])=>k&&v&&!['Цвет фасада','Спальное место','Размер'].includes(k)&&!/производител|артикул|sku/i.test(k));extra.innerHTML=entries.length?`<div class=\"pd-variant-note\"><b>Выбранный вариант</b><div>${selectedColor?`<span>Цвет: ${esc(selectedColor)}</span>`:''}${selectedSize?`<span>Размер: ${esc(selectedSize)}</span>`:''}${entries.slice(0,4).map(([k,v])=>`<span>${esc(k)}: ${esc(v)}</span>`).join('')}</div></div>`:'';}\n"""
          if old not in js:
              raise SystemExit('Target updateFurnitureSelection block not found')
          js = js.replace(old, new, 1)
          js_path.write_text(js, encoding='utf-8')

          html_path = Path('product.html')
          html = html_path.read_text(encoding='utf-8')
          import re
          html, count = re.subn(r'assets/product-detail\.js\?v=[^\"\']+', 'assets/product-detail.js?v=20260918-dynamicspec2', html, count=1)
          if count != 1:
              raise SystemExit('product-detail.js script reference not found')
          html_path.write_text(html, encoding='utf-8')
          PY
          node --check assets/product-detail.js
      - name: Remove one-time workflow
        run: rm .github/workflows/fix-product-characteristics-size.yml
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/product-detail.js product.html .github/workflows/fix-product-characteristics-size.yml
          git commit -m "Sync product characteristics with selected size"
          git push origin main
