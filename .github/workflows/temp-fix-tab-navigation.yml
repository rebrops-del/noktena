name: Temporary NOKTENA navigation patch

on:
  push:
    paths:
      - '.github/workflows/temp-fix-tab-navigation.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preserve homepage anchor navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('assets/catalog-v2.js')
          s=p.read_text(encoding='utf-8')
          old="    window.addEventListener('hashchange',()=>applyView(routeFromHash()));"
          new="""    window.addEventListener('hashchange',()=>{\n      const h=(location.hash||'#home').slice(1).split('?')[0];\n      if(views.has(h)){applyView(h);return}\n      if(['top','guide','delivery','about'].includes(h)){\n        applyView('home',{scroll:false});\n        requestAnimationFrame(()=>document.getElementById(h)?.scrollIntoView({behavior:'smooth',block:'start'}));\n        return;\n      }\n      applyView('home');\n    });"""
          if old not in s:
              raise SystemExit('hashchange marker not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'rebrops-del'
          git config user.email 'rebrops@gmail.com'
          git add assets/catalog-v2.js
          git commit -m 'Preserve homepage anchor navigation with category tabs'
          git pull --rebase origin main
          git push origin main
