name: Temporary font and product navigation fix

on:
  push:
    paths:
      - '.github/workflows/temp-font-nav-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch storefront files
        run: |
          python - <<'PY'
          from pathlib import Path

          old_font = '<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">'
          new_font = '<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">'

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace(old_font, new_font)
          marker = '<link rel="stylesheet" href="assets/premium-ui.css?v=20260918-premium3">'
          font_css = '<link rel="stylesheet" href="assets/font-refresh.css?v=20260918-1">'
          if font_css not in s:
              s = s.replace(marker, marker + '\n' + font_css)
          s = s.replace('assets/catalog-card-open.js?v=20260918-1', 'assets/catalog-card-open.js?v=20260918-2')
          p.write_text(s, encoding='utf-8')

          p = Path('product.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace(old_font, new_font)
          marker = '<link rel="stylesheet" href="assets/product-detail.css?v=20260918-premium2">'
          if font_css not in s:
              s = s.replace(marker, marker + '\n' + font_css)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'rebrops-del'
          git config user.email 'rebrops@gmail.com'
          git add index.html product.html
          git commit -m 'Fix product navigation and refresh typography'
          git pull --rebase origin main
          git push origin main
