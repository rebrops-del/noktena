name: Audit furniture image quality

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-furniture-image-quality.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify every furniture gallery image is high resolution
        run: |
          pip install requests pillow
          python - <<'PY'
          import io
          import json
          from concurrent.futures import ThreadPoolExecutor, as_completed

          import requests
          from PIL import Image

          data=json.load(open('data/furniture.json',encoding='utf-8'))
          products=list(data.get('beds',[]))+list(data.get('sofas',[]))
          urls=[]
          owner={}
          for p in products:
              for u in p.get('images') or []:
                  if u not in owner:
                      urls.append(u)
                      owner[u]=(p.get('sourceId'),p.get('title'))

          def check(url):
              r=requests.get(url,timeout=30,headers={'User-Agent':'Mozilla/5.0'})
              r.raise_for_status()
              im=Image.open(io.BytesIO(r.content))
              return r.status_code,len(r.content),im.width,im.height

          failed=[]
          low=[]
          small=[]
          dims={}
          with ThreadPoolExecutor(max_workers=20) as pool:
              futures={pool.submit(check,u):u for u in urls}
              for f in as_completed(futures):
                  u=futures[f]
                  if '/files/eshop/small/' in u.lower():
                      small.append((u,owner[u]))
                  try:
                      status,size,w,h=f.result()
                      dims[u]=(w,h,size)
                      if w < 800:
                          low.append((u,w,h,size,owner[u]))
                  except Exception as e:
                      failed.append((u,str(e),owner[u]))

          print('products',len(products))
          print('gallery_urls',len(urls))
          print('small_urls',len(small))
          print('failed_urls',len(failed))
          print('below_800px',len(low))
          if small:
              print('SMALL',small[:30])
          if failed:
              print('FAILED',failed[:30])
          if low:
              print('LOW',low[:50])

          samples=['24139a1.jpg','24182a1.jpg','13131a1.jpg']
          for needle in samples:
              for u,(w,h,size) in dims.items():
                  if u.endswith('/'+needle):
                      print('SAMPLE',needle,w,h,size,u)

          if small or failed:
              raise SystemExit('Gallery quality audit failed: small or broken URLs remain')
          PY
