name: Audit furniture image quality

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-furniture-image-quality.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect remaining low-resolution Berhouse sources
        run: |
          pip install requests beautifulsoup4 pillow
          python - <<'PY'
          import io
          import re
          import requests
          from bs4 import BeautifulSoup
          from PIL import Image
          from urllib.parse import urljoin

          s=requests.Session()
          s.headers['User-Agent']='Mozilla/5.0'
          for pid in ['24297','20779']:
              url=f'https://m.berhouse.ru/eshop/item/{pid}/'
              r=s.get(url,timeout=30)
              r.raise_for_status()
              r.encoding=r.apparent_encoding or r.encoding
              soup=BeautifulSoup(r.text,'html.parser')
              found=[]
              seen=set()
              for tag in soup.find_all(['a','img','source']):
                  for attr in ['href','src','data-src','data-original','data-lazy','data-image','data-zoom','data-large','srcset','data-srcset']:
                      raw=tag.get(attr)
                      if not raw: continue
                      for part in str(raw).split(','):
                          candidate=part.strip().split(' ')[0]
                          full=urljoin(r.url,candidate)
                          if pid not in full or '/files/eshop/' not in full or full in seen: continue
                          seen.add(full); found.append(full)
              for m in re.findall(r'https?://[^\"\'<>\s]+',r.text):
                  if pid in m and '/files/eshop/' in m and m not in seen:
                      seen.add(m); found.append(m)
              print('\nPRODUCT',pid,'SOURCE_URL',r.url,'CANDIDATES',len(found))
              for image_url in found:
                  try:
                      ir=s.get(image_url,timeout=20)
                      dims='n/a'
                      if ir.ok:
                          try:
                              im=Image.open(io.BytesIO(ir.content)); dims=f'{im.width}x{im.height}'
                          except Exception as e: dims=f'bad:{e}'
                      print(ir.status_code,len(ir.content),dims,image_url)
                  except Exception as e:
                      print('ERR',image_url,e)
          PY
