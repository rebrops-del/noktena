name: Add configurable card discount

on:
  push:
    paths:
      - '.github/workflows/add-configurable-card-discount.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch admin and storefront
        run: python3 .github/scripts/patch_configurable_discount.py

      - name: Validate changes
        run: |
          set -euo pipefail
          node --check admin/admin-enhancements.js
          node --check assets/catalog-v2.js
          grep -q 'productDiscountPercent' admin/admin-enhancements.js
          grep -q 'discountPercent=product' assets/catalog-v2.js
          grep -q 'data-card-discount' assets/catalog-v2.js
          grep -q 'admin-enhancements.js?v=9' admin/index.html
          grep -q 'catalog-v2.js?v=20260921-discount1' index.html

      - name: Commit patch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin/admin-enhancements.js admin/index.html assets/catalog-v2.js index.html
          if git diff --cached --quiet; then
            echo 'No changes needed'
            exit 0
          fi
          git commit -m 'Add configurable product discount percentage'
          git push
