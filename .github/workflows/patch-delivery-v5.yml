name: Patch delivery v5 asset versions
on:
  push:
    paths:
      - '.github/workflows/patch-delivery-v5.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump delivery assets
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['index.html','product.html']:
              p=Path(name)
              if not p.exists():
                  continue
              s=p.read_text(encoding='utf-8')
              s=s.replace('assets/catalog-runtime.js?v=20260921-delivery4','assets/catalog-runtime.js?v=20260921-delivery5')
              s=s.replace('assets/category-settings-ui.js?v=20260921-delivery4','assets/category-settings-ui.js?v=20260921-delivery5')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "noktena-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html product.html
          git commit -m "Publish expanded delivery settings UI"
          git push
