name: Feature Kuba on home

on:
  push:
    paths:
      - '.github/workflows/temp-home-kuba.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Replace third featured bed with Kuba
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('assets/catalog-v2.js')
          s=p.read_text(encoding='utf-8')
          pattern=r"function renderHomeHits\(\)\{.*?\}\n  async function loadFurniture"
          replacement="""function renderHomeHits(){
    const mount=$('#homeHitsGrid');if(!mount)return;
    if(!state.loaded){mount.innerHTML='<div class=\"f-loading\">Подбираем модели…</div>';return;}
    const excluded=p=>{const t=String(p?.title||'').toLowerCase();return t.includes('детская кровать стандарт')||(t.includes('диван тахта')&&t.includes('кушетка')&&t.includes('левый угол'));};
    const beds=state.data.beds.filter(p=>!excluded(p));
    const sofas=state.data.sofas.filter(p=>!excluded(p));
    const kuba=state.data.beds.find(p=>p.id==='berhouse-24136');
    const bedHits=beds.filter(x=>x.hit&&x.id!=='berhouse-24136');
    const sofaHits=sofas.filter(x=>x.hit);
    const bedPicks=(bedHits.length>=3?bedHits:beds.filter(x=>x.id!=='berhouse-24136')).slice(0,3);
    if(kuba){
      const kubaHit={...kuba,hit:true};
      if(bedPicks.length>=3)bedPicks[2]=kubaHit;else bedPicks.push(kubaHit);
    }
    const sofaPicks=(sofaHits.length>=3?sofaHits:sofas).slice(0,3);
    mount.innerHTML=[...bedPicks,...sofaPicks].map(cardMarkup).join('');
  }
  async function loadFurniture"""
          ns,n=re.subn(pattern,replacement,s,flags=re.S)
          if n!=1:
              raise SystemExit(f'renderHomeHits replacement count={n}')
          p.write_text(ns,encoding='utf-8')

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'assets/catalog-v2\.js\?v=[^"\']+', 'assets/catalog-v2.js?v=20260918-homekuba1', s)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate JavaScript
        run: |
          node --check assets/catalog-v2.js
          grep -q "berhouse-24136" assets/catalog-v2.js
          grep -q "20260918-homekuba1" index.html
      - name: Commit changes
        run: |
          git config user.name 'rebrops-del'
          git config user.email 'rebrops@gmail.com'
          git rm -f .github/workflows/temp-home-kuba.yml
          git add assets/catalog-v2.js index.html
          git commit -m 'Feature Kuba bed in popular models'
          git pull --rebase origin main
          git push origin main
