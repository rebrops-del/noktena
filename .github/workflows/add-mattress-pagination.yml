name: Add mattress pagination

on:
  push:
    paths:
      - '.github/workflows/add-mattress-pagination.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add pagination script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="assets/mattress-pagination.js?v=20260918-1"></script>'
          if tag not in s:
              s=s.replace('<script src="assets/catalog-v2.js?v=20260918-1"></script>', tag+'\n<script src="assets/catalog-v2.js?v=20260918-1"></script>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name 'rebrops-del'
          git config user.email 'rebrops@gmail.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Enable mattress catalog pagination'
          git push
