name: Clean furniture galleries

on:
  push:
    branches: [main]
    paths:
      - 'scripts/clean_furniture_galleries.py'
      - '.github/workflows/clean-furniture-galleries.yml'

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Install dependencies
        run: pip install requests beautifulsoup4 pillow
      - name: Keep all real gallery angles and remove visual duplicates
        run: python scripts/clean_furniture_galleries.py
      - name: Commit cleaned galleries
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/furniture.json
          if git diff --cached --quiet; then
            echo 'No gallery cleanup needed'
            exit 0
          fi
          git commit -m 'Rebuild furniture galleries from real Berhouse angles'
          git pull --rebase origin main
          git push origin main
