name: Clean furniture galleries

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix_furniture_colors.py'
      - 'scripts/clean_furniture_galleries.py'
      - '.github/workflows/clean-furniture-galleries.yml'

concurrency:
  group: clean-furniture-galleries
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Install dependencies
        run: pip install requests beautifulsoup4
      - name: Normalize public bed colors and preserve exact sofa colors
        run: python scripts/fix_furniture_colors.py
      - name: Keep all real angles and one photo per displayed color
        run: python scripts/clean_furniture_galleries.py
      - name: Commit cleaned galleries
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/furniture.json
          if git diff --cached --quiet; then
            echo 'No gallery cleanup needed'
            exit 0
          fi
          git commit -m 'Normalize furniture colors and deduplicate gallery photos'
          git pull --rebase origin main
          git push origin main
