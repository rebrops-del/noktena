name: Fix admin core price and photo bridge
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-admin-core-price-photo-bridge.yml'
      - 'scripts/fix_admin_core_bridge.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch admin
        run: python scripts/fix_admin_core_bridge.py
      - name: Validate JavaScript
        run: node --check admin/admin.js
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin/admin.js admin/index.html
          git commit -m 'Fix admin price propagation and photo bridge' || exit 0
          git push
