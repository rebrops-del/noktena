name: Refine Premium Storefront V5
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/refine-premium-v5.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Load refinement stylesheet
        run: |
          python - <<'PY'
          from pathlib import Path
          refine='<link rel="stylesheet" href="assets/storefront-premium-v5-refine.css?v=20260922-1">'
          for name in ['index.html','product.html','checkout.html']:
              p=Path(name)
              s=p.read_text(encoding='utf-8')
              s=s.replace('storefront-premium-v5.css?v=20260922-premium1','storefront-premium-v5.css?v=20260922-premium2')
              s=s.replace('storefront-premium-v5.css?v=20260922-premium2','storefront-premium-v5.css?v=20260922-premium2')
              import re
              s=re.sub(r'\n?<link rel="stylesheet" href="assets/storefront-premium-v5-refine\.css\?v=[^"]+">','',s)
              s=s.replace('</head>',refine+'\n</head>',1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        run: |
          set -euxo pipefail
          test -f assets/storefront-premium-v5-refine.css
          grep -q '.card .hit-badge' assets/storefront-premium-v5-refine.css
          grep -q '.global-delivery-product' assets/storefront-premium-v5-refine.css
          grep -q '.mobile .max-btn' assets/storefront-premium-v5-refine.css
          for f in index.html product.html checkout.html; do
            grep -q 'storefront-premium-v5.css?v=20260922-premium2' "$f"
            grep -q 'storefront-premium-v5-refine.css?v=20260922-1' "$f"
          done
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html product.html checkout.html
          git commit -m 'Load premium storefront visual refinements'
          git push
