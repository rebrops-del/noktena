name: Refine Premium Storefront V5
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/refine-premium-v5.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply visual QA refinements
        run: |
          cat >> assets/storefront-premium-v5.css <<'CSS'

/* ---------- V5.1 VISUAL QA REFINEMENTS ---------- */
/* Mattress badges must match furniture badges: compact, not full-width. */
.card .hit-badge,
.card .product-promo-badge{
  width:max-content!important;
  max-width:max-content!important;
  justify-self:start!important;
  align-self:start!important;
  padding:5px 10px!important;
}

/* Override older high-specificity green card rules. */
.card .body h3{color:#2b2d29!important}
.card .price{color:#282b27!important}
.card .firmness b{color:#454b46!important}
.card .size-select{width:100%!important;max-width:none!important}
.card .variantbox{width:100%!important}

/* Furniture specification block: more breathing room and stable single-line values. */
.f-premium-specs{padding-left:17px!important;padding-right:17px!important}
.f-premium-specs>div{min-height:41px!important;padding:9px 0!important}
.f-premium-specs span{font-size:11px!important;line-height:1.35!important}
.f-premium-specs b{font-size:11.2px!important;line-height:1.3!important;white-space:nowrap!important}

/* Remove remaining green from product detail controls and service notice. */
.global-delivery-product{
  margin-top:12px!important;
  padding:11px 13px!important;
  border:1px solid #e5dccf!important;
  border-radius:12px!important;
  background:#f6f1e8!important;
  color:#62594c!important;
  font-weight:600!important;
}
.global-delivery-product strong{color:#755936!important}
.pd-color.is-active{
  background:#2a2c28!important;
  color:#fff!important;
  border-color:#2a2c28!important;
  box-shadow:none!important;
}
.pd-info-card h1{
  font-size:clamp(38px,3.25vw,52px)!important;
  line-height:1.02!important;
  letter-spacing:-.035em!important;
}

/* Lower-page CTAs and footer continue the same charcoal / ivory system. */
.cta{
  background:#292b27!important;
  color:#fff!important;
  border:1px solid #353731!important;
  box-shadow:0 16px 42px rgba(39,36,31,.13)!important;
}
.cta p{color:#d8d6d0!important}
.footer{background:#262824!important;color:#d5d3cd!important}
.footer b,.footer a{color:#fff!important}

/* Mobile consultation control: small floating action instead of a screen-wide bar. */
@media(max-width:620px){
  .mobile{
    display:block!important;
    left:auto!important;
    right:10px!important;
    bottom:10px!important;
    width:auto!important;
    padding:0!important;
    border:0!important;
    border-radius:12px!important;
    background:transparent!important;
    box-shadow:none!important;
  }
  .mobile .max-btn{
    width:auto!important;
    min-width:0!important;
    min-height:42px!important;
    height:42px!important;
    padding:0 13px!important;
    border-radius:11px!important;
    background:rgba(255,255,255,.96)!important;
    border:1px solid #ddd7eb!important;
    box-shadow:0 10px 28px rgba(38,34,48,.12)!important;
    font-size:10.5px!important;
  }
  body{padding-bottom:58px!important}
  .f-premium-specs{padding-left:13px!important;padding-right:13px!important}
  .f-premium-specs span{font-size:10.3px!important}
  .f-premium-specs b{font-size:10.5px!important}
}
CSS

          python - <<'PY'
          from pathlib import Path
          for name in ['index.html','product.html','checkout.html']:
              p=Path(name)
              s=p.read_text(encoding='utf-8')
              s=s.replace('storefront-premium-v5.css?v=20260922-premium1','storefront-premium-v5.css?v=20260922-premium2')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        run: |
          set -euxo pipefail
          grep -q 'V5.1 VISUAL QA REFINEMENTS' assets/storefront-premium-v5.css
          grep -q '.card .hit-badge' assets/storefront-premium-v5.css
          grep -q '.global-delivery-product' assets/storefront-premium-v5.css
          grep -q '.mobile .max-btn' assets/storefront-premium-v5.css
          for f in index.html product.html checkout.html; do grep -q 'storefront-premium-v5.css?v=20260922-premium2' "$f"; done
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/storefront-premium-v5.css index.html product.html checkout.html
          git commit -m 'Refine premium storefront after visual QA'
          git push
