name: Bump admin photo client v4

on:
  push:
    paths:
      - '.github/workflows/bump-admin-photo-client-v4.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump admin asset versions
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('admin/index.html')
          s=p.read_text()
          s=s.replace('admin.css?v=20260919-colorphotos1','admin.css?v=20260919-photofix4')
          s=s.replace('admin.js?v=20260919-photofix2','admin.js?v=20260919-photofix4')
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Force refresh fixed admin photo uploader"
          git push
