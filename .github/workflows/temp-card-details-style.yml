name: Temporary premium card details styles

on:
  push:
    paths:
      - '.github/workflows/temp-card-details-style.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add premium accordion styles
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('assets/catalog-v2.css')
          s=p.read_text(encoding='utf-8')
          css='''\n.f-card-details{border:1px solid #e8e2d7;border-radius:14px;background:#fbfaf7;overflow:hidden}.f-card-details summary{min-height:45px;padding:0 13px;display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer;list-style:none;color:#40594f;font-size:10.5px;font-weight:800}.f-card-details summary::-webkit-details-marker{display:none}.f-card-details-plus{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:#f3ede1;color:#987943;font-size:16px;line-height:1;transition:.2s}.f-card-details[open] .f-card-details-plus{transform:rotate(45deg)}.f-card-details-body{border-top:1px solid #ebe5da;padding:13px;background:#fff}.f-card-details-body p{margin:0 0 12px;color:#66766f;font-size:10.5px;line-height:1.65;white-space:pre-line;max-height:148px;overflow:auto;padding-right:4px}.f-card-details-body dl{margin:0;display:grid;gap:0}.f-card-details-body dl>div{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:10px;padding:7px 0;border-bottom:1px solid #f0ece4}.f-card-details-body dt{color:#8a958f;font-size:9.5px}.f-card-details-body dd{margin:0;text-align:right;color:#354f44;font-size:9.5px;font-weight:750;overflow-wrap:anywhere}.f-card-details-link{margin-top:12px;display:inline-flex;color:#8d7040;text-decoration:none;font-size:10px;font-weight:800}.f-card-details-link:hover{color:#173e32}@media(max-width:620px){.f-card-details-body p{max-height:180px}.f-card-details-body dl>div{grid-template-columns:1fr}.f-card-details-body dd{text-align:left}}\n'''
          if '.f-card-details{' not in s:
              s=s.rstrip()+css+'\n'
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit card details styles
        run: |
          git config user.name 'rebrops-del'
          git config user.email 'rebrops@gmail.com'
          git add assets/catalog-v2.css
          git commit -m 'Style complete product information inside catalog cards'
          git pull --rebase origin main
          git push origin main
