name: Enable admin bootstrap UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/enable-admin-bootstrap-ui.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch admin page
        run: python scripts/enable_admin_bootstrap_ui.py
      - name: Validate bootstrap JavaScript
        run: node --check admin/bootstrap-ui.js
      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin/index.html
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Enable first-admin setup on admin page'
            git push
          fi
