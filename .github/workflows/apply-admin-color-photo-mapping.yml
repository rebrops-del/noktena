name: Apply admin color photo mapping
on:
  push:
    paths:
      - 'scripts/add_admin_color_photo_mapping.py'
      - '.github/workflows/apply-admin-color-photo-mapping.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python scripts/add_admin_color_photo_mapping.py
      - name: Validate admin JavaScript
        run: node --check admin/admin.js && node --check assets/catalog-runtime.js
      - name: Validate generated UI
        run: |
          grep -q 'id="colorImagesSection"' admin/index.html
          grep -q 'data-color-image-select' admin/admin.js
          grep -q "noktena-catalog-overrides-v2" assets/catalog-runtime.js
      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin/admin.js admin/index.html admin/admin.css assets/catalog-runtime.js
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Add color photo mapping to admin'
            git push
          fi
