name: Align catalog cards

on:
  push:
    paths:
      - '.github/workflows/align-catalog-cards.yml'

permissions:
  contents: write

jobs:
  align:
    if: github.event.head_commit.message == 'Add one-time catalog card alignment fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Align all catalog card rows
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* catalog-card-alignment-v1 */'
          assert marker not in s, 'alignment block already exists'
          assert s.count('</style>') == 1, f'expected one </style>, found {s.count("</style>")}'
          block = r'''
/* catalog-card-alignment-v1 */
.cardtop{
  display:grid;
  grid-template-rows:32px 52px 58px minmax(43px,auto);
  gap:10px;
}
.cardtop>.tag{
  align-self:start;
  margin:0;
}
.cardtop>.hit-ribbon{
  display:block;
  width:auto;
  height:32px;
  max-width:165px;
  object-fit:contain;
  object-position:left center;
  align-self:start;
  margin:0;
}
.body h3{
  height:52px;
  min-height:52px;
}
.firmness{
  height:58px;
  min-height:58px;
  max-height:58px;
  overflow:hidden;
}
.cardtop>.spec{
  min-height:43px;
}
@media(max-width:620px){
  .cardtop{grid-template-rows:32px 49px 58px minmax(43px,auto)}
  .body h3{height:49px;min-height:49px}
  .cardtop>.hit-ribbon{height:32px;max-width:145px}
}
'''
          s = s.replace('</style>', block + '\n</style>')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify alignment block
        run: |
          grep -q 'catalog-card-alignment-v1' index.html
          grep -q 'grid-template-rows:32px 52px 58px' index.html
          grep -q 'height:32px' index.html

      - name: Remove one-time workflow
        run: rm -f .github/workflows/align-catalog-cards.yml

      - name: Commit aligned cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Align all catalog card rows"
          git push origin HEAD:main
