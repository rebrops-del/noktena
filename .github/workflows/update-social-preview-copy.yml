name: Update social preview copy

on:
  push:
    paths:
      - '.github/workflows/update-social-preview-copy.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Update preview metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('НОКТЕНА — онлайн-магазин матрасов и товаров для сна. Подберём подходящий вариант по размеру, жёсткости и бюджету. Доставка по городам России.','НОКТЕНА — онлайн-магазин товаров для сна: матрасы, кровати и диваны. Поможем подобрать подходящую модель по размеру, комфорту и бюджету. Доставка по России.')
          s=s.replace('Онлайн-магазин матрасов и товаров для сна. Подберём подходящий вариант по размеру, жёсткости и бюджету. Доставка по городам России.','Онлайн-магазин товаров для сна: матрасы, кровати и диваны. Поможем подобрать подходящую модель по размеру, комфорту и бюджету. Доставка по России.')
          s=s.replace('Онлайн-магазин матрасов и товаров для сна. Подберём подходящий вариант по размеру, жёсткости и бюджету.','Онлайн-магазин товаров для сна: матрасы, кровати и диваны. Поможем подобрать подходящую модель по размеру, комфорту и бюджету.')
          s=s.replace('НОКТЕНА — матрасы и товары для сна','НОКТЕНА — матрасы, кровати и диваны')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes and remove temporary workflow
        run: |
          rm .github/workflows/update-social-preview-copy.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/update-social-preview-copy.yml
          git commit -m 'Update social preview description' || exit 0
          git push origin main
