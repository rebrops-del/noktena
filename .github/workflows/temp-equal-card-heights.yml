name: Equalize furniture card heights

on:
  push:
    paths:
      - '.github/workflows/temp-equal-card-heights.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Align furniture card sections
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          css = Path('assets/catalog-v2.css')
          s = css.read_text(encoding='utf-8')
          marker = '/* Equal-height furniture cards */'
          block = r'''

/* Equal-height furniture cards */
@media (min-width:621px){
  .f-grid{align-items:stretch}
  .f-card{height:100%}
  .f-card-body{height:100%;display:flex;flex-direction:column;gap:14px}
  .f-card-eyebrow{height:14px;min-height:14px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .f-card h3{height:56px;min-height:56px;max-height:56px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .f-card-summary{height:60px;min-height:60px;max-height:60px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .f-premium-specs{height:102px;min-height:102px;max-height:102px;overflow:hidden;display:grid;grid-template-rows:repeat(3,34px);align-content:start}
  .f-premium-specs>div{height:34px;min-height:34px;padding:0;display:flex;align-items:center;justify-content:space-between}
  .f-card-details{height:46px;min-height:46px}
  .f-card-details summary{height:46px;min-height:46px}
  .f-option{min-height:72px;height:72px;display:grid;grid-template-rows:18px 44px;gap:10px}
  .f-option-head{height:18px;min-height:18px}
  .f-size-select{height:44px}
  .f-card-bottom{margin-top:auto;display:grid;gap:10px}
  .f-price-row{height:78px;min-height:78px}
  .product-more-link{height:52px;min-height:52px}
  .f-card .max-btn{height:50px;min-height:50px}
}
@media (max-width:620px){
  .f-premium-specs{min-height:102px}
  .f-card-details{min-height:46px}
  .f-option{min-height:72px}
}
'''
          if marker not in s:
              s += block
          css.write_text(s, encoding='utf-8')

          p = Path('index.html')
          html = p.read_text(encoding='utf-8')
          html = re.sub("assets/catalog-v2\\.css\\?v=[^\"']+", 'assets/catalog-v2.css?v=20260918-equalcards1', html)
          p.write_text(html, encoding='utf-8')
          PY
      - name: Validate layout patch
        run: |
          grep -q 'Equal-height furniture cards' assets/catalog-v2.css
          grep -q '20260918-equalcards1' index.html
      - name: Commit changes
        run: |
          git config user.name 'rebrops-del'
          git config user.email 'rebrops@gmail.com'
          git rm -f .github/workflows/temp-equal-card-heights.yml
          git add assets/catalog-v2.css index.html
          git commit -m 'Align furniture card content and heights'
          git pull --rebase origin main
          git push origin main
