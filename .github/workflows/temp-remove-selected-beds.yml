name: Temporary remove selected bed cards

on:
  push:
    paths:
      - '.github/workflows/temp-remove-selected-beds.yml'

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove selected bed products
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('data/furniture.json')
          data = json.loads(path.read_text(encoding='utf-8'))

          targets = [
              'горизонт мини',
              'екатеринбург мини',
              'стандарт мини',
              'мета с матрасом',
              'эко стандарт',
              'эко екатеринбург',
          ]

          beds = data.get('beds', [])
          matched = {t: [] for t in targets}
          kept = []

          for product in beds:
              title = str(product.get('title', ''))
              low = title.lower().replace('ё', 'е')
              hits = [t for t in targets if t.replace('ё', 'е') in low]
              if hits:
                  for t in hits:
                      matched[t].append(title)
              else:
                  kept.append(product)

          missing = [t for t, titles in matched.items() if not titles]
          if missing:
              print('Matched titles:')
              for t, titles in matched.items():
                  print(t, '=>', titles)
              raise SystemExit('Did not find target(s): ' + ', '.join(missing))

          removed_titles = []
          for titles in matched.values():
              for title in titles:
                  if title not in removed_titles:
                      removed_titles.append(title)

          data['beds'] = kept
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          print('Removed', len(removed_titles), 'bed cards:')
          for title in removed_titles:
              print('-', title)
          print('Beds remaining:', len(kept))
          PY
      - name: Commit changes
        run: |
          git config user.name 'rebrops-del'
          git config user.email 'rebrops@gmail.com'
          git add data/furniture.json
          git commit -m 'Remove selected bed cards from catalog'
          git pull --rebase origin main
          git push origin main
