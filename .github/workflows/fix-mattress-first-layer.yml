name: Fix mattress first composition layer
on:
  push:
    paths:
      - '.github/workflows/fix-mattress-first-layer.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Separate firmness from first composition layer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/product-detail-content-polish.js')
          s=p.read_text()
          old="""    if(!composition.length&&!facts.length)return;\n    ensureMattressStyles();\n\n    const compositionHtml=composition.length\n      ? `<div class=\"pd-mattress-block\"><h3>Состав</h3><ul class=\"pd-mattress-list\">${composition.map(item=>`<li>${escapeHtml(item)}</li>`).join('')}</ul></div>`\n      : '';\n"""
          new="""    const normalizedComposition=[];\n    const firmnessPrefix=/^Ж[её]сткость\\s*:?[\\s—-]*(максимально\\s+ж[её]сткая|выше\\s+средней|ниже\\s+средней|средняя|мягкая|ж[её]сткая)(?:\\s+|$)(.*)$/i;\n    for(const originalItem of composition){\n      const item=cleanMattressItem(originalItem);\n      const match=item.match(firmnessPrefix);\n      if(match){\n        addFact('Жёсткость',match[1]);\n        const remainder=cleanMattressItem(match[2]||'');\n        if(remainder)normalizedComposition.push(remainder);\n        continue;\n      }\n      if(item)normalizedComposition.push(item);\n    }\n    composition.splice(0,composition.length,...normalizedComposition);\n\n    if(!composition.length&&!facts.length)return;\n    ensureMattressStyles();\n\n    const compositionHtml=composition.length\n      ? `<div class=\"pd-mattress-block\"><h3>Состав</h3><ul class=\"pd-mattress-list\">${composition.map(item=>`<li>${escapeHtml(item)}</li>`).join('')}</ul></div>`\n      : '';\n"""
          if old not in s:
              raise SystemExit('target JS block not found')
          p.write_text(s.replace(old,new,1))

          h=Path('product.html')
          hs=h.read_text()
          oldv='assets/product-detail-content-polish.js?v=20260918-description4'
          newv='assets/product-detail-content-polish.js?v=20260918-description5'
          if oldv not in hs:
              raise SystemExit('product cache key not found')
          h.write_text(hs.replace(oldv,newv,1))
          PY
          node --check assets/product-detail-content-polish.js
          grep -q 'description5' product.html
      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/product-detail-content-polish.js product.html
          git commit -m 'Separate firmness from mattress first layer'
          git rm .github/workflows/fix-mattress-first-layer.yml
          git commit -m 'Remove temporary mattress first-layer workflow'
          git push origin HEAD:main
