name: Apply direct Storage upload

on:
  push:
    paths:
      - 'scripts/switch_admin_upload_to_direct_storage.py'
      - '.github/workflows/apply-direct-storage-upload.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch admin uploader
        run: python scripts/switch_admin_upload_to_direct_storage.py
      - name: Validate JavaScript
        run: node --check admin/admin.js
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin/admin.js admin/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Upload admin photos directly to Storage'
          git push
