name: Refresh sofa colors from Berhouse

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-sofa-colors.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install parser dependencies
        run: pip install requests beautifulsoup4
      - name: Refresh exact sofa color labels
        run: python scripts/refresh_sofa_colors.py
      - name: Verify critical sofas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('data/furniture.json').read_text(encoding='utf-8'))
          byid={p['id']:p for p in data.get('sofas',[])}
          checks={
            'berhouse-24182':['Беж Велюто 05','Серый Велюто 12','Коричневый Велюто 23','Бордо Велюто 25','Оранж Велюто 27','Темно серый Велюто 32','Азур Велюто 44','Синий Велюто 54'],
            'berhouse-24285':['Зеленый','Светло серый','Голубой','Синий','Светло коричневый','Серый'],
          }
          for pid, expected in checks.items():
              actual=byid[pid].get('colors',[])
              print(pid, actual)
              if actual != expected:
                  raise SystemExit(f'{pid}: expected {expected}, got {actual}')
          print('Critical sofa color verification passed')
          PY
      - name: Commit refreshed catalog
        run: |
          if git diff --quiet -- data/furniture.json; then
            echo 'No sofa color changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/furniture.json
          git commit -m 'Replace sofa color names with exact Berhouse variants'
          git push
