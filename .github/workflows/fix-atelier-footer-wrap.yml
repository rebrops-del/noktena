name: Fix Atelier footer wrap
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-atelier-footer-wrap.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Keep footer inside storefront content width
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('assets/atelier-v1.js')
          s=p.read_text()
          old="foot.className='premium-footer-grid';"
          new="foot.className='wrap premium-footer-grid';"
          if old not in s:
              raise SystemExit('footer marker not found')
          p.write_text(s.replace(old,new,1))
          PY
          node --check assets/atelier-v1.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/atelier-v1.js
          git diff --cached --quiet && exit 0
          git commit -m 'Keep premium footer within content width'
          git push
