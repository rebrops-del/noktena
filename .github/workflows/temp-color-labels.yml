name: Replace furniture color swatches with text labels

on:
  push:
    paths:
      - '.github/workflows/temp-color-labels.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Replace color icons with text labels
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('assets/catalog-v2.js')
          s=p.read_text(encoding='utf-8')
          old='''${colors.slice(0,8).map((c,i)=>`<button type="button" class="f-color ${i===0?'is-active':''}" data-card-color="${esc(c)}" title="${esc(c)}" aria-label="Цвет ${esc(c)}" style="--swatch:${swatchCss(c)}"></button>`).join('')}'''
          new='''${colors.slice(0,8).map((c,i)=>`<button type="button" class="f-color ${i===0?'is-active':''}" data-card-color="${esc(c)}" title="${esc(c)}" aria-label="Цвет ${esc(c)}">${esc(c)}</button>`).join('')}'''
          if old not in s:
              raise SystemExit('catalog-v2 color swatch markup not found')
          s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')

          p=Path('assets/product-detail.js')
          s=p.read_text(encoding='utf-8')
          old='''${colors.map((c,i)=>`<button type="button" class="pd-color ${i===0?'is-active':''}" data-pd-color="${esc(c)}" style="--swatch:${swatchCss(c)}"><span class="pd-color-dot" aria-hidden="true"></span><span>${esc(c)}</span></button>`).join('')}'''
          new='''${colors.map((c,i)=>`<button type="button" class="pd-color ${i===0?'is-active':''}" data-pd-color="${esc(c)}">${esc(c)}</button>`).join('')}'''
          if old not in s:
              raise SystemExit('product-detail color swatch markup not found')
          s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')

          p=Path('assets/catalog-v2.css')
          s=p.read_text(encoding='utf-8')
          s += '''\n/* Text-only color selector */\n.f-color-list{gap:7px;align-items:center}\n.f-color{width:auto;height:auto;min-height:32px;padding:0 11px;border-radius:999px;background:#fff!important;color:#42594f;border:1px solid rgba(23,62,50,.16);box-shadow:none;font:700 10px/1 Manrope,"Segoe UI",sans-serif;white-space:nowrap}\n.f-color:hover{transform:none;border-color:#9e8353;background:#faf8f3!important;color:#173e32}\n.f-color.is-active{background:#173e32!important;color:#fff;border-color:#173e32;box-shadow:0 6px 14px rgba(23,62,50,.14)}\n.f-more-options{display:inline-flex;align-items:center;min-height:32px;padding:0 9px;border-radius:999px;background:#f4f0e8;color:#6f766f}\n@media(max-width:620px){.f-color{min-height:34px;padding:0 10px;font-size:10px}}\n'''
          p.write_text(s,encoding='utf-8')

          p=Path('assets/product-detail.css')
          s=p.read_text(encoding='utf-8')
          s += '''\n/* Text-only color selector */\n.pd-colors{gap:8px}\n.pd-color{min-height:40px;padding:0 14px;border-radius:999px;background:#fff;color:#405a50;border:1px solid rgba(23,62,50,.14);font-weight:700}\n.pd-color:hover{border-color:#9e8353;background:#faf8f3}\n.pd-color.is-active{background:#173e32;color:#fff;border-color:#173e32;box-shadow:0 7px 18px rgba(23,62,50,.14)}\n.pd-color-dot{display:none!important}\n'''
          p.write_text(s,encoding='utf-8')

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'assets/catalog-v2\.css\?v=[^"\']+', 'assets/catalog-v2.css?v=20260918-textcolors1', s)
          s=re.sub(r'assets/catalog-v2\.js\?v=[^"\']+', 'assets/catalog-v2.js?v=20260918-textcolors1', s)
          p.write_text(s,encoding='utf-8')

          p=Path('product.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'assets/product-detail\.css\?v=[^"\']+', 'assets/product-detail.css?v=20260918-textcolors1', s)
          s=re.sub(r'assets/product-detail\.js\?v=[^"\']+', 'assets/product-detail.js?v=20260918-textcolors1', s)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate JavaScript
        run: |
          node --check assets/catalog-v2.js
          node --check assets/product-detail.js
          grep -q '20260918-textcolors1' index.html
          grep -q '20260918-textcolors1' product.html
      - name: Commit changes
        run: |
          git config user.name 'rebrops-del'
          git config user.email 'rebrops@gmail.com'
          git rm -f .github/workflows/temp-color-labels.yml
          git add assets/catalog-v2.js assets/catalog-v2.css assets/product-detail.js assets/product-detail.css index.html product.html
          git commit -m 'Show furniture colors as text labels'
          git pull --rebase origin main
          git push origin main
