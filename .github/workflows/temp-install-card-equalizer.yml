name: Install exact card alignment

on:
  push:
    paths:
      - '.github/workflows/temp-install-card-equalizer.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Install final card equalizer
        run: |
          sed -i 's#assets/card-visual-fixes.css?v=20260918-1#assets/card-visual-fixes.css?v=20260918-2#' index.html
          if ! grep -q 'assets/card-equalizer.js' index.html; then
            sed -i 's#<script src="assets/catalog-card-open.js?v=20260918-2"></script>#<script src="assets/catalog-card-open.js?v=20260918-2"></script>\n<script src="assets/card-equalizer.js?v=20260918-1"></script>#' index.html
          fi
      - name: Validate
        run: |
          grep -q 'card-visual-fixes.css?v=20260918-2' index.html
          grep -q 'card-equalizer.js?v=20260918-1' index.html
          test -f assets/card-equalizer.js
      - name: Commit changes
        run: |
          git config user.name 'rebrops-del'
          git config user.email 'rebrops@gmail.com'
          git rm -f .github/workflows/temp-install-card-equalizer.yml
          git add index.html
          git commit -m 'Apply exact furniture card alignment'
          git pull --rebase origin main
          git push origin main
