name: Update Noktena contacts

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/contact-update.yml

permissions:
  contents: write

jobs:
  update-contacts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Update contacts
        run: python .github/scripts/update_contacts.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Replace Avito contacts with email phone and MAX"
          git push origin main
