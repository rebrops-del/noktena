name: Temporary furniture gallery import fix

on:
  push:
    paths:
      - '.github/workflows/temp-improve-furniture-images.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Improve Berhouse image discovery
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/import_berhouse_furniture.py')
          s = p.read_text(encoding='utf-8')
          old = 'srcs = [img.get(k) for k in ["src", "data-src", "data-original", "data-lazy", "data-srcset"]]'
          new = 'srcs = [img.get(k) for k in ["src", "data-src", "data-original", "data-lazy", "data-srcset", "srcset", "data-image", "data-zoom", "data-large"]]'
          if old in s:
              s = s.replace(old, new, 1)
          old = 'if product_id in href and re.search(r"\\.(?:jpe?g|png|webp)(?:\\?|$)", href, re.I):'
          new = 'if re.search(r"\\.(?:jpe?g|png|webp)(?:\\?|$)", href, re.I) and (product_id in href or "/files/eshop/" in href):'
          if old in s:
              s = s.replace(old, new, 1)
          old = 'return [u for _, u in found[:10]]'
          if old not in s:
              raise SystemExit('Image limit marker not found')
          s = s.replace(old, 'return [u for _, u in found[:30]]', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit image importer fix
        run: |
          git config user.name 'rebrops-del'
          git config user.email 'rebrops@gmail.com'
          git add scripts/import_berhouse_furniture.py
          git commit -m 'Import more furniture gallery photos'
          git pull --rebase origin main
          git push origin main
