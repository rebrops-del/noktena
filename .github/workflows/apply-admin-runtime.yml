name: Apply admin runtime integration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-admin-runtime.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply storefront integration
        run: python scripts/enable_admin_runtime.py
      - name: Validate JavaScript syntax
        run: |
          node --check assets/catalog-runtime.js
          node --check assets/catalog-v2.js
          node --check assets/product-detail.js
          node --check admin/admin.js
      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html product.html assets/catalog-v2.js assets/product-detail.js
          if git diff --cached --quiet; then
            echo 'No generated changes'
          else
            git commit -m 'Connect admin overrides to storefront'
            git push
          fi
# retry: 3
