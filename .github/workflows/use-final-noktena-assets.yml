name: Use final Noktena assets

on:
  push:
    paths:
      - '.github/workflows/use-final-noktena-assets.yml'

permissions:
  contents: write

jobs:
  switch-assets:
    if: github.event.head_commit.message == 'Add final Noktena asset switcher'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Switch index to manually uploaded final assets
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old_logo = 'assets/logo-noktena.png?v=20260908-brand3'
          new_logo = 'assets/logo-noktena-final.png?v=20260908-final2'
          old_hero = 'assets/hero-noktena.webp?v=20260908-brand3'
          new_hero = 'assets/hero-noktena-final.png?v=20260908-final2'
          assert s.count(old_logo) == 1, f'logo source count={s.count(old_logo)}'
          assert s.count(old_hero) == 1, f'hero source count={s.count(old_hero)}'
          s = s.replace(old_logo, new_logo).replace(old_hero, new_hero)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Remove one-time workflow
        run: rm -f .github/workflows/use-final-noktena-assets.yml

      - name: Commit final switch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Switch to manually uploaded Noktena assets"
          git push origin HEAD:main
