name: Test premium storefront
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'product.html'
      - 'checkout.html'
      - 'assets/storefront-2026.css'
      - 'assets/product-2026.css'
      - 'assets/product-detail.js'
      - '.github/workflows/test-atelier-storefront.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check current storefront files
        run: |
          set -euo pipefail
          node --check assets/product-detail.js
          grep -q 'storefront-2026.css' index.html
          grep -q 'product-2026.css' product.html
          grep -q 'checkout-2026.css' checkout.html
          grep -q 'removeBrokenGalleryPhoto' assets/product-detail.js
          test -s assets/admin-mattress-thumbs/r4-c5.webp
      - name: Wait for live premium pages
        run: |
          set -euo pipefail
          city_script=$(grep -o 'assets/city-catalog.js?v=[^"]*' index.html | head -1)
          product_script=$(grep -o 'assets/product-detail.js?v=[^"]*' product.html | head -1)
          admin_script=$(grep -o './city-catalog.js?v=[^"]*' admin/index.html | head -1)
          for i in $(seq 1 40); do
            home=$(curl -fsSL --max-time 20 "https://noktena.ru/?release=$GITHUB_SHA" || true)
            product=$(curl -fsSL --max-time 20 "https://noktena.ru/product.html?release=$GITHUB_SHA" || true)
            admin=$(curl -fsSL --max-time 20 "https://noktena.ru/admin/?release=$GITHUB_SHA" || true)
            css=$(curl -fsSL --max-time 20 "https://noktena.ru/assets/product-2026.css?release=$GITHUB_SHA" || true)
            if [[ "$home" == *'storefront-2026.css'* ]] \
              && [[ "$home" == *"$city_script"* ]] \
              && [[ "$product" == *"$city_script"* ]] \
              && [[ "$product" == *"$product_script"* ]] \
              && [[ "$admin" == *"$admin_script"* ]] \
              && [[ "$css" == *'pd-main-media.pd-mattress-media'* ]]; then
              exit 0
            fi
            sleep 5
          done
          echo 'Premium pages did not become ready' >&2
          exit 1
