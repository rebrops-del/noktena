name: Temporary luxury index integration

on:
  push:
    paths:
      - '.github/workflows/temp-luxury-index.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integrate luxury typography and styles
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<meta name="theme-color" content="#0A8D55">'
          fonts='''<meta name="theme-color" content="#0A8D55">\n<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">'''
          if 'family=Cormorant+Garamond' not in s:
              if marker not in s: raise SystemExit('theme marker missing')
              s=s.replace(marker,fonts,1)
          css_marker='<link rel="stylesheet" href="assets/catalog-card-enhancements.css?v=20260918-1">'
          if 'assets/luxury.css' not in s:
              if css_marker not in s: raise SystemExit('css marker missing')
              s=s.replace(css_marker,css_marker+'\n<link rel="stylesheet" href="assets/luxury.css?v=20260918-1">',1)
          s=s.replace('assets/catalog-v2.js?v=20260918-2','assets/catalog-v2.js?v=20260918-3')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit integration
        run: |
          git config user.name 'rebrops-del'
          git config user.email 'rebrops@gmail.com'
          git add index.html
          git commit -m 'Apply premium NOKTENA storefront design'
          git pull --rebase origin main
          git push origin main
