name: Inspect sofa color labels

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-sofa-color-names.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Print sofa color labels
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('data/furniture.json').read_text(encoding='utf-8'))
          print('SOFAS', len(data.get('sofas', [])))
          all_colors = set()
          for p in data.get('sofas', []):
              colors = []
              seen = set()
              for v in p.get('variants') or []:
                  c = str(v.get('color') or '').strip()
                  if c and c not in seen:
                      seen.add(c); colors.append(c); all_colors.add(c)
              print('SOFA', p.get('sourceId'), '|', p.get('title'), '|', ' ; '.join(colors))
          print('UNIQUE COLORS:', ' ; '.join(sorted(all_colors)))
          PY
