name: Bump furniture gallery filter cache

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bump-gallery-filter-cache.yml'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Bump asset version
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('product.html')
          s=p.read_text(encoding='utf-8')
          old='assets/furniture-source-colors.js?v=20260918-sofacolors2'
          new='assets/furniture-source-colors.js?v=20260918-galleryfix3'
          if old not in s and new not in s:
              raise SystemExit('Expected furniture-source-colors script tag not found')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add product.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh furniture gallery filter cache'
          git pull --rebase origin main
          git push origin main
