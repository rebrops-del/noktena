name: Refresh curated furniture gallery cache

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bump-gallery-filter-cache.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Refresh frontend asset and fix CSS typo
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('product.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('-webkit-background-clip:text;background-clip;color:transparent;', '-webkit-background-clip:text;background-clip:text;color:transparent;')
          s=s.replace('assets/furniture-source-colors.js?v=20260918-sofacolors2','assets/furniture-source-colors.js?v=20260918-galleryfix4')
          s=s.replace('assets/furniture-source-colors.js?v=20260918-galleryfix3','assets/furniture-source-colors.js?v=20260918-galleryfix4')
          if 'assets/furniture-source-colors.js?v=20260918-galleryfix4' not in s:
              raise SystemExit('Expected furniture gallery asset tag not found')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add product.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh curated furniture gallery frontend'
          git pull --rebase origin main
          git push origin main
