name: Implement category pricing and delivery
on:
  push:
    paths:
      - '.github/workflows/implement-category-settings.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update public catalog runtime
        run: |
          cat > assets/catalog-runtime.js <<'JS'
          (() => {
            'use strict';
            const cfg=window.NOKTENA_ADMIN_CONFIG||{};
            const configured=()=>Boolean(cfg.supabaseUrl&&cfg.supabaseAnonKey);
            const CACHE_KEY='noktena-catalog-overrides-v4';
            const MAX_INITIAL_WAIT_MS=900;
            let rowsPromise=null;
            const headers=()=>({apikey:cfg.supabaseAnonKey,Accept:'application/json'});
            const productKey=(kind,product)=>kind==='furniture'?`furniture:${product?.id||''}`:`mattress:${product?.model||''}`;
            const bootstrap=()=>window.NOKTENA_CATALOG_BOOTSTRAP||{};
            const settingsList=()=>Array.isArray(bootstrap().categorySettings)?bootstrap().categorySettings:[];
            const getCategorySettings=()=>settingsList().map(x=>({...x,price_value:Number(x.price_value)||0,delivery_price:Number(x.delivery_price)||0,free_delivery_from:Number(x.free_delivery_from)||0}));
            const settingFor=category=>getCategorySettings().find(x=>x.category===category)||{category,price_mode:'percent',price_value:0,delivery_price:0,free_delivery_from:0};
            function readCache(){try{const parsed=JSON.parse(localStorage.getItem(CACHE_KEY)||'null');return Array.isArray(parsed?.rows)?parsed.rows:[]}catch{return[]}}
            function writeCache(rows){try{localStorage.setItem(CACHE_KEY,JSON.stringify({rows,savedAt:Date.now()}))}catch{}}
            function resolveCatalogImageTokens(rows,assets){const assetMap=new Map((assets||[]).map(row=>[`asset:${row.id}`,row.data_url]));const resolveOne=value=>assetMap.get(String(value||''))||value;return(rows||[]).map(row=>{if(!row?.payload||typeof row.payload!=='object')return row;const payload={...row.payload};if(Array.isArray(payload.images))payload.images=payload.images.map(resolveOne);if(payload.colorImages&&typeof payload.colorImages==='object')payload.colorImages=Object.fromEntries(Object.entries(payload.colorImages).map(([color,value])=>[color,resolveOne(value)]));return{...row,payload}})}
            async function fetchRows(){const b=bootstrap();if(Array.isArray(b.rows)){if(!rowsPromise){const resolved=resolveCatalogImageTokens(b.rows,Array.isArray(b.assets)?b.assets:[]);writeCache(resolved);rowsPromise=Promise.resolve(resolved)}return rowsPromise}if(!configured())return[];if(!rowsPromise){const cached=readCache(),root=cfg.supabaseUrl.replace(/\/$/,'');const network=Promise.all([fetch(`${root}/rest/v1/catalog_overrides?select=product_key,kind,payload,hidden,is_custom,updated_at`,{headers:headers(),cache:'no-store'}),fetch(`${root}/rest/v1/catalog_images?select=id,data_url`,{headers:headers(),cache:'no-store'})]).then(async([a,b])=>{if(!a.ok)throw new Error(`Supabase catalog HTTP ${a.status}`);if(!b.ok)throw new Error(`Supabase images HTTP ${b.status}`);const[rows,assets]=await Promise.all([a.json(),b.json()]);const resolved=resolveCatalogImageTokens(rows,assets);writeCache(resolved);return resolved}).catch(err=>{console.warn('NOKTENA catalog overrides unavailable; using cached/base catalog.',err);return cached});rowsPromise=cached.length?Promise.resolve(cached):Promise.race([network,new Promise(resolve=>setTimeout(()=>resolve([]),MAX_INITIAL_WAIT_MS))])}return rowsPromise}
            function applyRows(baseItems,kind,rows){const relevant=rows.filter(r=>r.kind===kind),byKey=new Map(relevant.filter(r=>!r.is_custom).map(r=>[r.product_key,r])),merged=[];for(const base of baseItems||[]){const row=byKey.get(productKey(kind,base));if(row?.hidden)continue;merged.push(row?{...base,...(row.payload||{})}:base)}for(const row of relevant.filter(r=>r.is_custom&&!r.hidden))if(row.payload&&typeof row.payload==='object')merged.push({...row.payload});return merged}
            function priceAdjusted(value,setting){const n=Number(value);if(!Number.isFinite(n)||n<=0)return value;const change=setting.price_mode==='fixed'?n+Number(setting.price_value||0):n*(1+Number(setting.price_value||0)/100);return Math.max(0,Math.round(change/100)*100)}
            function applyCategory(item,category){const setting=settingFor(category),out={...item};if(!out.skipCategoryPriceAdjustment){if(Number(out.price)>0)out.price=priceAdjusted(out.price,setting);if(Array.isArray(out.variants))out.variants=out.variants.map(v=>({...v,price:Number(v?.price)>0?priceAdjusted(v.price,setting):v?.price}))}const hasDelivery=Object.prototype.hasOwnProperty.call(out,'deliveryPriceOverride')&&out.deliveryPriceOverride!==''&&out.deliveryPriceOverride!=null;const hasFree=Object.prototype.hasOwnProperty.call(out,'freeDeliveryFromOverride')&&out.freeDeliveryFromOverride!==''&&out.freeDeliveryFromOverride!=null;out.deliveryPrice=hasDelivery?Math.max(0,Number(out.deliveryPriceOverride)||0):Math.max(0,Number(setting.delivery_price)||0);out.freeDeliveryFrom=hasFree?Math.max(0,Number(out.freeDeliveryFromOverride)||0):Math.max(0,Number(setting.free_delivery_from)||0);out.categoryPriceMode=setting.price_mode;out.categoryPriceValue=Number(setting.price_value)||0;return out}
            async function mergeFurniture(data){const rows=await fetchRows(),base=[...(data?.beds||[]),...(data?.sofas||[])],items=applyRows(base,'furniture',rows);return{...data,beds:items.filter(p=>p.category==='beds').map(p=>applyCategory(p,'beds')),sofas:items.filter(p=>p.category==='sofas').map(p=>applyCategory(p,'sofas'))}}
            async function mergeMattresses(items){const rows=await fetchRows();return applyRows(items||[],'mattress',rows).map(p=>applyCategory(p,'mattress'))}
            function resetCache(){rowsPromise=null;try{localStorage.removeItem(CACHE_KEY)}catch{}}
            window.NoktenaCatalog=Object.freeze({configured,productKey,mergeFurniture,mergeMattresses,resetCache,getCategorySettings,settingFor});
          })();
          JS
      - name: Add delivery UI helper
        run: |
          cat > assets/category-settings-ui.js <<'JS'
          (()=>{
            'use strict';
            const rows=Array.isArray(window.NOKTENA_CATALOG_BOOTSTRAP?.categorySettings)?window.NOKTENA_CATALOG_BOOTSTRAP.categorySettings:[];
            if(!rows.length)return;
            const map=new Map(rows.map(x=>[x.category,{...x,delivery_price:Number(x.delivery_price)||0,free_delivery_from:Number(x.free_delivery_from)||0}]));
            const money=n=>`${Math.round(Number(n)||0).toLocaleString('ru-RU')} ₽`;
            const labels={mattress:'Матрасы',beds:'Кровати',sofas:'Диваны'};
            const deliveryText=s=>s.delivery_price>0?money(s.delivery_price):'Стоимость уточняется';
            const freeText=s=>s.free_delivery_from>0?`Бесплатно от ${money(s.free_delivery_from)}`:'';
            const style=document.createElement('style');style.textContent='.category-rate-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:18px 0}.category-rate-card{padding:16px;border:1px solid #d7e8de;border-radius:16px;background:#fff}.category-rate-card span{display:block;color:#667a70;font-size:12px}.category-rate-card b{display:block;margin:5px 0;color:#0a8d55;font-size:20px}.category-delivery-chip,.category-delivery-product{margin-top:8px;padding:9px 11px;border-radius:10px;background:#f2f8f4;color:#315c4c;font-size:12px;font-weight:700}.category-delivery-product{margin:12px 0 0;font-size:13px}.category-delivery-product strong{color:#0a8d55}@media(max-width:700px){.category-rate-grid{grid-template-columns:1fr}}';document.head.appendChild(style);
            function addRates(){const box=document.querySelector('#delivery .deliverybox');if(!box||box.querySelector('.category-rate-grid'))return;const grid=document.createElement('div');grid.className='category-rate-grid';grid.innerHTML=['mattress','beds','sofas'].map(k=>{const s=map.get(k)||{};return`<div class="category-rate-card"><span>${labels[k]}</span><b>${deliveryText(s)}</b>${freeText(s)?`<span>${freeText(s)}</span>`:''}</div>`}).join('');const lead=box.querySelector('.delivery-lead');if(lead)lead.insertAdjacentElement('afterend',grid);else box.prepend(grid)}
            async function furnitureMap(){try{const r=await fetch('data/furniture.json?delivery-ui=1',{cache:'force-cache'});if(!r.ok)return new Map();const d=await r.json();return new Map([...(d.beds||[]).map(x=>[String(x.id),'beds']),...(d.sofas||[]).map(x=>[String(x.id),'sofas'])])}catch{return new Map()}}
            function customCategory(id){const row=(window.NOKTENA_CATALOG_BOOTSTRAP?.rows||[]).find(r=>r.product_key===`furniture:${id}`);return row?.payload?.category||''}
            function rowOverride(kind,key){const pk=kind==='mattress'?`mattress:${key}`:`furniture:${key}`;return(window.NOKTENA_CATALOG_BOOTSTRAP?.rows||[]).find(r=>r.product_key===pk)?.payload||null}
            function effective(category,override){const s=map.get(category)||{delivery_price:0,free_delivery_from:0};const hasD=override&&Object.prototype.hasOwnProperty.call(override,'deliveryPriceOverride')&&override.deliveryPriceOverride!==''&&override.deliveryPriceOverride!=null;const hasF=override&&Object.prototype.hasOwnProperty.call(override,'freeDeliveryFromOverride')&&override.freeDeliveryFromOverride!==''&&override.freeDeliveryFromOverride!=null;return{delivery_price:hasD?Number(override.deliveryPriceOverride)||0:s.delivery_price,free_delivery_from:hasF?Number(override.freeDeliveryFromOverride)||0:s.free_delivery_from}}
            function chipText(s){const a=s.delivery_price>0?`Доставка ${money(s.delivery_price)}`:'Доставка — стоимость уточняется';return s.free_delivery_from>0?`${a} · бесплатно от ${money(s.free_delivery_from)}`:a}
            async function decorateCards(){const fmap=await furnitureMap();document.querySelectorAll('.product-open-card:not([data-delivery-decorated])').forEach(card=>{const link=card.getAttribute('data-product-link')||card.querySelector('a[href*="product.html"]')?.getAttribute('href')||'';let category='',key='',kind='';try{const u=new URL(link,location.href),p=u.searchParams;kind=p.get('kind')||'';if(kind==='mattress'){category='mattress';key=p.get('model')||''}else if(kind==='furniture'){key=p.get('id')||'';category=customCategory(key)||fmap.get(key)||''}}catch{}if(!category)return;const s=effective(category,rowOverride(kind,key)),target=card.querySelector('.cardbottom,.f-card-bottom,.body,.f-card-body');if(target){const el=document.createElement('div');el.className='category-delivery-chip';el.textContent=chipText(s);target.prepend(el);card.dataset.deliveryDecorated='1'}})}
            async function addProductDelivery(){const p=new URLSearchParams(location.search),kind=p.get('kind');if(!kind)return;let category='',key='';if(kind==='mattress'){category='mattress';key=p.get('model')||''}else if(kind==='furniture'){key=p.get('id')||'';category=customCategory(key);if(!category)category=(await furnitureMap()).get(key)||''}if(!category)return;const s=effective(category,rowOverride(kind,key));const inject=()=>{const price=document.querySelector('.pd-info-card .pd-price-row');if(!price||document.querySelector('.category-delivery-product'))return false;const el=document.createElement('div');el.className='category-delivery-product';el.innerHTML=`<strong>Доставка:</strong> ${chipText(s).replace(/^Доставка\s*[—-]?\s*/,'')}`;price.insertAdjacentElement('afterend',el);return true};if(inject())return;const mo=new MutationObserver(()=>{if(inject())mo.disconnect()});mo.observe(document.getElementById('productRoot')||document.body,{childList:true,subtree:true});setTimeout(()=>mo.disconnect(),10000)}
            addRates();decorateCards();addProductDelivery();const observer=new MutationObserver(()=>decorateCards());observer.observe(document.body,{childList:true,subtree:true});
          })();
          JS
      - name: Patch admin UI and scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('admin/index.html'); t=p.read_text(encoding='utf-8')
          t=t.replace('<button id="bulk" class="btn secondary" type="button">Цены %</button>','<button id="bulk" class="btn secondary" type="button">Цены %</button>\n          <button id="settingsOpen" class="btn secondary" type="button">Цены и доставка</button>')
          t=t.replace('<label>В наличии<select id="available"><option value="1">Да</option><option value="0">Нет</option></select></label>','<label>В наличии<select id="available"><option value="1">Да</option><option value="0">Нет</option></select></label>\n          <label>Индивидуальная доставка, ₽<input id="deliveryOverride" type="number" min="0" placeholder="Пусто = по категории"></label>\n          <label>Бесплатная доставка от, ₽<input id="freeDeliveryOverride" type="number" min="0" placeholder="Пусто = по категории"></label>')
          t=t.replace('<label class="section check"><input id="hidden" type="checkbox"> Скрыть товар на сайте</label>','<label class="section check"><input id="hidden" type="checkbox"> Скрыть товар на сайте</label>\n        <label class="check"><input id="skipCategoryPrice" type="checkbox"> Не применять наценку категории к этому товару</label>')
          modal='''\n  <div id="settingsModal" class="modal hide">\n    <div class="modalbox">\n      <div class="modalhead"><div><b>Цены и доставка по категориям</b><div class="muted">Настройки применяются автоматически ко всему каталогу.</div></div><button id="settingsClose" type="button" class="btn secondary">Закрыть</button></div>\n      <form id="settingsForm"><div id="settingsRows" class="settings-grid"></div><div class="savebar"><span></span><div class="actions"><button id="settingsCancel" type="button" class="btn secondary">Отмена</button><button type="submit" class="btn primary">Сохранить настройки</button></div></div></form>\n    </div>\n  </div>\n\n'''
          t=t.replace('  <div id="newModal" class="modal hide">',modal+'  <div id="newModal" class="modal hide">')
          t=t.replace('./admin.css?v=4','./admin.css?v=5').replace('./admin.js?v=4','./admin.js?v=5')
          p.write_text(t,encoding='utf-8')

          p=Path('admin/admin.js'); t=p.read_text(encoding='utf-8')
          t=t.replace('let originalBasePrice=0;','let originalBasePrice=0;\nlet categorySettings=[];')
          t=t.replace("  $('#available').value=draft.available===false?'0':'1';","  $('#available').value=draft.available===false?'0':'1';\n  $('#deliveryOverride').value=draft.deliveryPriceOverride??'';\n  $('#freeDeliveryOverride').value=draft.freeDeliveryFromOverride??'';\n  $('#skipCategoryPrice').checked=!!draft.skipCategoryPriceAdjustment;")
          t=t.replace("  $('#available').value='1';","  $('#available').value='1';\n  $('#deliveryOverride').value='';\n  $('#freeDeliveryOverride').value='';\n  $('#skipCategoryPrice').checked=false;")
          t=t.replace("    draft.description=$('#description').value.trim();","    draft.description=$('#description').value.trim();\n    const deliveryRaw=$('#deliveryOverride').value.trim();\n    const freeRaw=$('#freeDeliveryOverride').value.trim();\n    if(deliveryRaw==='')delete draft.deliveryPriceOverride;else draft.deliveryPriceOverride=Math.max(0,Number(deliveryRaw)||0);\n    if(freeRaw==='')delete draft.freeDeliveryFromOverride;else draft.freeDeliveryFromOverride=Math.max(0,Number(freeRaw)||0);\n    draft.skipCategoryPriceAdjustment=$('#skipCategoryPrice').checked;")
          anchor='async function start(){'
          funcs=r'''function settingsLabel(category){return category==='mattress'?'Матрасы':category==='beds'?'Кровати':'Диваны'}
          function renderCategorySettings(){
            const defaults=['mattress','beds','sofas'].map(category=>({category,price_mode:'percent',price_value:0,delivery_price:0,free_delivery_from:0}));
            const merged=defaults.map(d=>({...d,...(categorySettings.find(x=>x.category===d.category)||{})}));
            $('#settingsRows').innerHTML=merged.map(s=>`<section class="settings-card" data-settings-category="${s.category}"><h3>${settingsLabel(s.category)}</h3><label>Изменение цены<select data-settings-mode><option value="percent" ${s.price_mode==='percent'?'selected':''}>Процент, %</option><option value="fixed" ${s.price_mode==='fixed'?'selected':''}>Сумма, ₽</option></select></label><label>Наценка / скидка<input data-settings-value type="number" step="1" value="${Number(s.price_value)||0}"></label><label>Доставка, ₽<input data-settings-delivery type="number" min="0" value="${Number(s.delivery_price)||0}"></label><label>Бесплатная доставка от, ₽<input data-settings-free type="number" min="0" value="${Number(s.free_delivery_from)||0}"></label><div class="muted">0 в поле доставки = стоимость уточняется. 0 в «бесплатно от» = порог отключён.</div></section>`).join('');
          }
          async function openCategorySettings(){
            try{const data=await request('settings');categorySettings=Array.isArray(data.settings)?data.settings:[];renderCategorySettings();$('#settingsModal').classList.remove('hide')}catch(error){toast(error.message,true)}
          }
          function closeCategorySettings(){$('#settingsModal').classList.add('hide')}
          async function saveCategorySettings(event){
            event.preventDefault();
            const rows=$$('[data-settings-category]').map(card=>({category:card.dataset.settingsCategory,price_mode:card.querySelector('[data-settings-mode]').value,price_value:Number(card.querySelector('[data-settings-value]').value)||0,delivery_price:Math.max(0,Number(card.querySelector('[data-settings-delivery]').value)||0),free_delivery_from:Math.max(0,Number(card.querySelector('[data-settings-free]').value)||0)}));
            try{const data=await request('settings-save',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({rows})});categorySettings=data.settings||rows;closeCategorySettings();toast('Настройки цен и доставки сохранены')}catch(error){toast(error.message,true)}
          }

          '''
          if anchor not in t: raise SystemExit('start anchor missing')
          t=t.replace(anchor,funcs+anchor,1)
          t=t.replace("$('#bulk').addEventListener('click',bulkPrices);","$('#bulk').addEventListener('click',bulkPrices);\n$('#settingsOpen').addEventListener('click',openCategorySettings);\n$('#settingsClose').addEventListener('click',closeCategorySettings);\n$('#settingsCancel').addEventListener('click',closeCategorySettings);\n$('#settingsForm').addEventListener('submit',saveCategorySettings);")
          p.write_text(t,encoding='utf-8')

          p=Path('admin/admin.css'); t=p.read_text(encoding='utf-8')
          t += '\n.settings-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:16px}.settings-card{border:1px solid var(--line);border-radius:16px;padding:16px;background:#f9fbfa}.settings-card h3{margin:0 0 10px}.settings-card label{margin:10px 0}@media(max-width:900px){.settings-grid{grid-template-columns:1fr}}\n'
          p.write_text(t,encoding='utf-8')
          PY
      - name: Include delivery helper on public pages
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['index.html','product.html']:
              p=Path(name); t=p.read_text(encoding='utf-8')
              t=t.replace('assets/catalog-runtime.js?v=20260921-localonly1','assets/catalog-runtime.js?v=20260921-category1')
              marker='<script src="assets/catalog-runtime.js?v=20260921-category1"></script>'
              if marker not in t: raise SystemExit(f'runtime marker missing in {name}')
              if 'category-settings-ui.js' not in t:t=t.replace(marker,marker+'\n<script src="assets/category-settings-ui.js?v=20260921-category1"></script>')
              p.write_text(t,encoding='utf-8')
          PY
      - name: Validate JavaScript
        run: |
          node --check assets/catalog-runtime.js
          node --check assets/category-settings-ui.js
          node --check admin/admin.js
          grep -q 'settingsOpen' admin/index.html
          grep -q 'categorySettings' assets/catalog-runtime.js
          grep -q 'category-settings-ui.js' index.html
          grep -q 'category-settings-ui.js' product.html
      - name: Commit changes
        run: |
          set -euxo pipefail
          git config user.name 'noktena-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/catalog-runtime.js assets/category-settings-ui.js admin/index.html admin/admin.js admin/admin.css index.html product.html
          git commit -m 'Add category pricing and delivery controls'
          git push
