<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<title>Загрузка фото</title>
</head>
<body>
<script>
(() => {
  const q = new URLSearchParams(location.search);
  const requestId = q.get('request_id') || q.get('nonce') || '';
  const payload = {
    type: 'noktena-admin-bridge',
    request_id: requestId,
    action: q.get('action') || 'save_image',
    ok: q.get('ok') === '1',
    url: q.get('url') || '',
    error: q.get('error') || '',
    detail: q.get('detail') || ''
  };
  try {
    if (window.parent && window.parent !== window) {
      window.parent.postMessage(payload, location.origin);
    }
  } catch (_) {}
  document.body.textContent = payload.ok ? 'Фото загружено' : (payload.error || 'Ошибка загрузки');
})();
</script>
</body>
</html>
